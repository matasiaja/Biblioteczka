<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteczka</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#14161A">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Biblioteczka">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
<style>
  :root{
    --bg:#14161A; --surface:#1C1F26; --surface-2:#262A33; --border:#333844;
    --text:#ECEDEF; --text-dim:#9AA0AC;
    --accent:#7C5CFF; --accent-dim:#6247CC;
    --ok:#3DDC84; --warn:#FFB020; --danger:#FF4D4D;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Space Grotesk',sans-serif;-webkit-font-smoothing:antialiased;}
  .mono{font-family:'IBM Plex Mono',monospace;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:78px;}
  header.topbar{position:sticky;top:0;z-index:10;background:rgba(20,22,26,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border);padding:16px 18px;display:flex;align-items:center;justify-content:space-between;}
  header.topbar h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.2px;}
  header.topbar .sub{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
  main{flex:1;padding:16px;}
  nav.bottom{position:fixed;bottom:0;left:0;right:0;background:rgba(28,31,38,.96);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;gap:6px;max-width:520px;margin:0 auto;padding:8px 8px calc(8px + env(safe-area-inset-bottom));}
  nav.bottom button{flex:1;background:linear-gradient(180deg,rgba(255,255,255,.1),rgba(255,255,255,.02));border:1px solid var(--border);border-radius:10px;color:var(--text-dim);padding:9px 4px 7px;font-family:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4),0 5px 10px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .08s ease,box-shadow .08s ease,color .15s,background .15s;}
  nav.bottom button:active{background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(255,255,255,.01));box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 3px 6px rgba(0,0,0,.35);transform:translateY(2px);}
  nav.bottom button.active{color:var(--accent);background:linear-gradient(180deg,rgba(124,92,255,.28),rgba(124,92,255,.06));border-color:rgba(124,92,255,.35);}
  nav.bottom button svg{width:20px;height:20px;}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  .btn{background:linear-gradient(180deg,#9c84ff,var(--accent) 55%,var(--accent-dim));color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.35);border:none;border-radius:10px;padding:13px 18px;font-family:inherit;font-weight:700;font-size:14px;letter-spacing:.2px;cursor:pointer;width:100%;box-shadow:0 6px 0 #3a2a80,0 10px 18px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.2);transition:transform .08s ease,box-shadow .08s ease,background .15s;}
  .btn:active{background:linear-gradient(180deg,var(--accent-dim),#3a2a80);box-shadow:0 1px 0 #3a2a80,inset 0 4px 8px rgba(0,0,0,.5);transform:translateY(5px);}
  .btn:hover{background:linear-gradient(180deg,#9c84ff,var(--accent) 55%,var(--accent-dim));}
  .btn.secondary{background:linear-gradient(180deg,rgba(190,198,214,.32),rgba(148,163,184,.04)),var(--surface-2);color:var(--text);font-weight:700;text-shadow:none;border:1px solid var(--border);box-shadow:0 6px 0 rgba(0,0,0,.5),0 10px 16px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.2),inset 0 -3px 6px rgba(0,0,0,.2);}
  .btn.secondary:active{background:rgba(148,163,184,.1);box-shadow:0 1px 0 rgba(0,0,0,.5),inset 0 4px 8px rgba(0,0,0,.4);transform:translateY(5px);}
  .btn.danger{background:linear-gradient(180deg,#ff9494,var(--danger) 55%,#d63c3c);box-shadow:0 6px 0 #8a2424,0 10px 18px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45),inset 0 -3px 6px rgba(0,0,0,.2);}
  .btn.danger:active{background:linear-gradient(180deg,var(--danger),#8a2424);box-shadow:0 1px 0 #8a2424,inset 0 4px 8px rgba(0,0,0,.5);transform:translateY(5px);}
  .btn.small{width:auto;padding:9px 14px;font-size:13px;}
  .btn:disabled{opacity:.5;cursor:default;box-shadow:none;transform:none;}
  .btn svg{width:18px;height:18px;flex-shrink:0;}
  .icon-btn{background:linear-gradient(180deg,rgba(190,198,214,.18),rgba(148,163,184,.04)),var(--surface-2);border:1px solid var(--border);color:var(--text-dim);cursor:pointer;padding:6px;display:flex;align-items:center;justify-content:center;border-radius:8px;box-shadow:0 3px 0 rgba(0,0,0,.4),0 5px 8px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.15);transition:color .15s,background .15s,transform .08s ease,box-shadow .08s ease;}
  .icon-btn svg{width:20px;height:20px;}
  .icon-btn:hover{color:var(--text);}
  .icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 2px 5px rgba(0,0,0,.3);}
  .icon-btn.active{color:var(--accent);border-color:var(--accent);}
  input,select,textarea{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 12px;font-family:inherit;font-size:14px;margin-bottom:10px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);}
  .hw-scan-box{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:12px;margin-bottom:12px;}
  .hw-scan-box .hw-scan-label{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;margin-bottom:8px;text-transform:none;}
  .hw-scan-box .hw-scan-label svg{width:14px;height:14px;flex-shrink:0;}
  .hw-scan-input{margin-bottom:0;border-color:var(--accent);background:var(--surface);font-family:'IBM Plex Mono',monospace;letter-spacing:.5px;}
  .hw-scan-input::placeholder{font-family:inherit;letter-spacing:normal;}
  label{font-size:12px;color:var(--text-dim);display:block;margin-bottom:5px;font-family:'IBM Plex Mono',monospace;}
  .row{display:flex;gap:10px;}
  .row>*{flex:1;}
  .badge{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;}
  .badge.ok{background:rgba(61,220,132,.15);color:var(--ok);}
  .badge.warn{background:rgba(255,176,32,.15);color:var(--warn);}
  .badge.danger{background:rgba(255,77,77,.15);color:var(--danger);}
  .badge.accent{background:rgba(124,92,255,.15);color:var(--accent);}
  .item-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer;gap:10px;}
  .item-row:last-child{border-bottom:none;}
  .item-row .name{font-weight:500;font-size:14px;}
  .item-row .meta{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;margin-top:2px;}
  .row-title{flex:1;min-width:0;}
  .row-col-check{display:contents;}
  .row-col{display:none;}
  .item-row-header{display:none;}
  .empty{text-align:center;color:var(--text-dim);padding:40px 20px;font-size:13px;}
  .empty svg{width:40px;height:40px;opacity:.4;margin-bottom:10px;}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .tabs button{flex:1;background:linear-gradient(180deg,rgba(190,198,214,.2),rgba(148,163,184,.04)),var(--surface-2);border:1px solid var(--border);color:var(--text);font-weight:600;border-radius:9px;padding:9px;font-family:inherit;font-size:12px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.4),0 5px 8px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.15);transition:transform .08s ease,box-shadow .08s ease,background .15s;}
  .tabs button:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 2px 5px rgba(0,0,0,.3);}
  .tabs button.active{background:linear-gradient(180deg,#9c84ff,var(--accent) 55%,var(--accent-dim));border-color:var(--accent);color:#fff;box-shadow:0 1px 0 #3a2a80,inset 0 2px 5px rgba(0,0,0,.35);transform:translateY(1px);}
  /* Kafelki: tryby skanowania (Sprawdź/Wypożycz/Zwrot) i filtry Kolekcji (Szukaj/Kolekcja/
     Lista życzeń/Kolejka, typ) — ten sam 3D .btn/.btn.secondary co reszta appki, tylko
     ułożony w symetryczną siatkę zamiast paska. Na desktopie robią się większe/kwadratowe. */
  .scan-modes{display:grid;grid-template-columns:1fr 1fr;grid-template-areas:"sprawdz sprawdz" "wypozycz zwrot";gap:8px;margin-top:10px;}
  .scan-modes button{display:flex;align-items:center;justify-content:center;gap:8px;}
  .tile-sprawdz{grid-area:sprawdz;}
  .tile-wypozycz{grid-area:wypozycz;}
  .tile-zwrot{grid-area:zwrot;}
  .filter-tiles{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .filter-tile{width:auto;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:9px;font-size:12px;}
  .filter-tile svg{width:16px;height:16px;flex-shrink:0;}
  /* scanner */
  #reader{width:100%;border-radius:var(--radius);overflow:hidden;background:#000;position:relative;}
  .scan-frame{position:relative;}
  .scan-hint{text-align:center;color:var(--text-dim);font-size:12px;margin-top:12px;font-family:'IBM Plex Mono',monospace;}
  .laser{position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:sweep 1.8s ease-in-out infinite;pointer-events:none;z-index:5;}
  @keyframes sweep{0%,100%{top:30%;}50%{top:70%;}}
  .corner{position:absolute;width:26px;height:26px;border-color:var(--accent);z-index:5;pointer-events:none;}
  .corner.tl{top:8%;left:8%;border-top:3px solid var(--accent);border-left:3px solid var(--accent);border-radius:6px 0 0 0;}
  .corner.tr{top:8%;right:8%;border-top:3px solid var(--accent);border-right:3px solid var(--accent);border-radius:0 6px 0 0;}
  .corner.bl{bottom:8%;left:8%;border-bottom:3px solid var(--accent);border-left:3px solid var(--accent);border-radius:0 0 0 6px;}
  .corner.br{bottom:8%;right:8%;border-bottom:3px solid var(--accent);border-right:3px solid var(--accent);border-radius:0 0 6px 0;}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--border);padding:10px 16px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 4px 20px rgba(0,0,0,.4);max-width:90%;text-align:center;}
  .link{color:var(--accent);background:none;border:none;font-family:inherit;font-size:13px;cursor:pointer;padding:0;}
  .section-title{font-size:12px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;font-family:'IBM Plex Mono',monospace;margin:4px 0 10px;}
  .attr-link{cursor:pointer;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;text-decoration-color:currentColor;opacity:.9;}
  .clamp-text.clamped{display:-webkit-box;-webkit-line-clamp:6;-webkit-box-orient:vertical;overflow:hidden;}
  .attr-link:hover{color:var(--accent);opacity:1;}
  .config-warn{background:rgba(255,176,32,.1);border:1px solid var(--warn);color:var(--warn);border-radius:10px;padding:14px;font-size:13px;line-height:1.5;margin:16px;}
  .cover{width:44px;height:60px;border-radius:5px;object-fit:cover;background:var(--surface-2);flex-shrink:0;box-shadow:0 3px 0 rgba(0,0,0,.4),0 6px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15),inset 0 -2px 4px rgba(0,0,0,.15);transition:transform .08s ease,box-shadow .08s ease;}
  .cover.square{width:60px;height:60px;}
  .item-row:active .cover,.grid-item:active .cover,.cover-tap:active .cover{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 3px 6px rgba(0,0,0,.45);}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:14px;}
  .grid-item{cursor:pointer;}
  .grid-item .cover{width:100%;height:auto;aspect-ratio:2/3;}
  .grid-item .cover.square{aspect-ratio:1/1;}
  .grid-item .grid-placeholder{width:100%;aspect-ratio:2/3;border-radius:5px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-dim);box-shadow:0 3px 0 rgba(0,0,0,.4),0 6px 12px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.1),inset 0 -2px 4px rgba(0,0,0,.15);transition:transform .08s ease,box-shadow .08s ease;}
  .grid-item .grid-placeholder.square{aspect-ratio:1/1;}
  .grid-item:active .grid-placeholder{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4),inset 0 3px 6px rgba(0,0,0,.45);}
  .grid-item .name{font-size:12px;font-weight:500;margin-top:6px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;}
  .grid-item .checkbox-overlay{position:absolute;top:6px;left:6px;width:18px;height:18px;margin:0;z-index:1;}
  .grid-item-wrap{position:relative;}
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(84px,1fr));gap:10px;}
  .stat-tile{background:var(--surface-2);border-radius:10px;padding:12px 10px;text-align:center;cursor:pointer;transition:background .15s,transform .1s;}
  .stat-tile:hover{background:var(--border);}
  .stat-tile:active{transform:scale(.97);}
  .stat-tile .stat-num{font-size:22px;font-weight:700;line-height:1.1;font-family:'Space Grotesk',sans-serif;}
  .stat-tile .stat-label{font-size:11px;color:var(--text-dim);margin-top:4px;line-height:1.3;}
  .stat-group-label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.6px;font-family:'IBM Plex Mono',monospace;margin:14px 0 8px;}
  .stat-group-label:first-child{margin-top:0;}
  .sidebar{display:none;}
  .item-detail-card{display:flex;flex-direction:column;}
  .record-fields{display:none;}

  /* ---------------- DESKTOP (mysz/trackpad, szeroki ekran) ----------------
     Układ jak w systemie bibliotecznym: stały panel nawigacji po lewej,
     szersza siatka z większymi okładkami, karta pozycji dwukolumnowa
     (duża okładka + szczegóły). Telefony/tablety (pointer:coarse) mają
     interfejs bez zmian — to dotyczy wyłącznie urządzeń z myszką/trackpadem. */
  @media (pointer:fine) and (min-width:900px){
    body{overflow:hidden;}
    #app{max-width:none;display:grid;grid-template-columns:252px 1fr;grid-template-rows:auto 1fr;padding-bottom:0;height:100vh;overflow:hidden;}
    #app>.sidebar{grid-column:1;grid-row:1/3;height:100%;min-height:0;}
    #app>.app-top{grid-column:2;grid-row:1;min-width:0;}
    #app>main{grid-column:2;grid-row:2;min-width:0;min-height:0;}
    header.topbar{padding:20px 32px;}
    main{overflow-y:auto;padding:28px 36px 60px;max-width:1160px;margin:0 auto;width:100%;}
    nav.bottom{display:none;}
    .sidebar{display:flex;flex-direction:column;background:var(--surface);border-right:1px solid var(--border);padding:22px 14px;gap:4px;overflow-y:auto;}
    .sidebar-logo{display:flex;align-items:center;gap:10px;padding:2px 10px 24px;cursor:pointer;}
    .sidebar-logo img{width:34px;height:34px;border-radius:8px;flex-shrink:0;}
    .sidebar-logo h1{font-size:16px;margin:0;font-weight:700;letter-spacing:.2px;}
    .sidebar-logo .sub{font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;}
    .sidebar-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .sidebar-nav button{flex-direction:column;justify-content:center;align-items:center;gap:9px;padding:20px 8px;font-size:13px;width:100%;text-align:center;aspect-ratio:1/1;}
    .sidebar-nav button svg{width:24px;height:24px;}
    /* Kafelki trybów skanowania i filtrów Kolekcji: większe, kwadratowe, w rzędzie/siatce. */
    .scan-modes{grid-template-columns:repeat(3,1fr);grid-template-areas:"sprawdz wypozycz zwrot";gap:12px;}
    .scan-modes button{flex-direction:column;padding:22px 10px;gap:10px;font-size:13px;}
    .scan-modes button svg{width:24px;height:24px;}
    .filter-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
    .filter-tile{flex-direction:column;padding:16px 8px;gap:8px;font-size:13px;text-align:center;aspect-ratio:1.4/1;}
    .filter-tile svg{width:20px;height:20px;}
    .grid{grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:24px;}
    /* Widok listy jako prawdziwa tabela katalogowa: kolumny Okładka / Tytuł-Autor /
       Rodzaj / Format / Rok / Status, z wierszem nagłówka nad danymi. Ograniczone do
       .catalog-row — .item-row samo w sobie jest używane też w wielu innych, niezwiązanych
       miejscach (wyniki wyszukiwania, kolejka, wypożyczenia...), których nie chcemy dotykać. */
    .catalog-row{display:grid;grid-template-columns:22px 56px 1fr 100px 120px 64px 150px;gap:16px;align-items:center;}
    .item-row.catalog-row{padding:10px 8px;border-radius:8px;}
    .item-row.catalog-row:hover{background:var(--surface-2);}
    .item-row-header{padding:0 8px 10px;margin-bottom:2px;border-bottom:1px solid var(--border);font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;cursor:default;}
    .item-row.catalog-row .cover{width:56px;height:76px;}
    .row-col-check{display:flex;align-items:center;justify-content:center;}
    .row-col{display:flex;align-items:center;font-size:12px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;}
    .row-col-status-mobile{display:none;}
    .item-detail-card{flex-direction:row;gap:36px;align-items:flex-start;max-width:900px;}
    .item-detail-card .item-detail-cover{flex:0 0 auto;}
    .item-detail-card .item-detail-body{flex:1;min-width:0;}
    /* Karta pozycji jako rekord biblioteczny: etykietowane pola zamiast jednej linijki tekstu. */
    .item-detail-meta-compact{display:none;}
    .record-fields{display:block;margin:0 0 18px;border:1px solid var(--border);border-radius:10px;overflow:hidden;}
    .record-row{display:grid;grid-template-columns:150px 1fr;border-bottom:1px solid var(--border);}
    .record-row:last-child{border-bottom:none;}
    .record-row dt{margin:0;padding:9px 14px;background:var(--surface-2);font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;display:flex;align-items:center;}
    /* Filtry/zakładki i pasek narzędzi kolekcji: na szerokim ekranie mają wyglądać jak
       kompaktowe "chipy" przy lewej krawędzi, a nie rozciągnięte na całą szerokość paski. */
    .tabs button{flex:0 0 auto;padding:9px 18px;}
    .list-toolbar{justify-content:flex-start;flex-wrap:wrap;}
    .list-toolbar .btn{flex:0 0 auto;width:auto;padding:12px 22px;}
    /* Panel filtrów Kolekcji: stała kolumna po lewej stronie siatki okładek, przyklejona
       do góry obszaru przewijania (position:sticky), więc nie ucieka razem z okładkami. */
    .list-layout{display:flex;gap:32px;align-items:flex-start;}
    .list-filters{flex:0 0 300px;position:sticky;top:20px;}
    .list-results{flex:1;min-width:0;}
    .record-row dd{margin:0;padding:9px 14px;font-size:13px;display:flex;align-items:center;}
  }
</style>
</head>
<body>
<div id="app"></div>

<script>
// ==========================================================
// KONFIGURACJA

// ---------------- SZKIC FORMULARZA DODAWANIA/EDYCJI (przetrwa zabicie karty przez przeglądarkę) ----------------
// Telefony (zwł. iOS) potrafią w pełni ubić uśpioną kartę, żeby odzyskać pamięć — zwykły stan w JS
// wtedy znika bez śladu, nawet jeśli nic nie odświeżało widoku. Trzymamy więc bieżący szkic też
// w localStorage i wczytujemy go z powrotem przy starcie, żeby "wróć do karty" nie kasowało wpisanych danych.
function setLookup(value){
  state.lookup = value;
  if (value) localStorage.setItem('bib_draft', JSON.stringify(value));
  else localStorage.removeItem('bib_draft');
}

function saveDraft(){
  if (state.lookup) localStorage.setItem('bib_draft', JSON.stringify(state.lookup));
}

function syncDraftField(field, value){
  if (!state.lookup) return;
  state.lookup[field] = value;
  saveDraft();
}

// ---------------- NAWIGACJA: fizyczny/systemowy przycisk "Wstecz" ----------------
// Ta sama logika co w Spotigraj: zakładka 'scan' jest korzeniem — Back z niej zamyka appkę.
// Pozostałe zakładki są jej dziećmi (replaceState — Back z każdej z nich wraca do 'scan',
// niezależnie od realnej ścieżki kliknięć). Widoki szczegółowe (formularz dodawania/edycji,
// szczegóły pozycji, wyszukiwanie) są dziećmi aktywnej zakładki (pushState przy otwarciu —
// przyciski "X"/"Wróć" w UI same historii nie ruszają, więc jeden fizyczny Back cofa dokładnie
// jeden poziom, tak jak w Spotigraj).
let navFoundationReady = false;
function ensureNavFoundation(){
  if (navFoundationReady) return;
  navFoundationReady = true;
  window.history.replaceState({ tab: state.tab, _foundation: true }, '', '#' + state.tab);
  window.history.pushState({ tab: state.tab, _foundation: true }, '', '#' + state.tab);
}

// Backspace poza polem tekstowym działa jak fizyczny/systemowy przycisk Wstecz —
// przydatne na komputerze, gdzie nie ma go fizycznie. Ten sam mechanizm (history.back()),
// więc cofa dokładnie jeden poziom zgodnie z powyższą logiką nawigacji.
document.addEventListener('keydown', function(e){
  if (e.key !== 'Backspace') return;
  const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
  const editable = document.activeElement && document.activeElement.isContentEditable;
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || editable) return;
  e.preventDefault();
  window.history.back();
});

// Spacja poza polem tekstowym skacze prosto do pola skanowania — niezależnie od tego jak
// głęboko w nawigacji (karta pozycji, formularz nowej pozycji...) user się aktualnie znajduje.
document.addEventListener('keydown', function(e){
  if (e.key !== ' ') return;
  const tag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
  const editable = document.activeElement && document.activeElement.isContentEditable;
  if (tag === 'input' || tag === 'textarea' || tag === 'select' || editable) return;
  e.preventDefault();
  setTab('scan');
});

window.addEventListener('popstate', function(){
  clearTimeout(checkModeTimer);
  if (!session) return;
  if (state.lookup){
    setLookup(null);
    state.openItemId = null;
    renderTab();
    return;
  }
  if (state.openItemId){
    state.openItemId = null;
    renderTab();
    return;
  }
  if (state.attrFilter){
    state.attrFilter = null;
    renderTab();
    return;
  }
  if (state.searchMode){
    state.searchMode = false;
    state.searchQuery = '';
    renderTab();
    return;
  }
  if (state.tab === 'scan') return; // korzeń — Back zamyka appkę
  state.tab = 'scan';
  state.scannedBarcode = null;
  state.scannedItem = null;
  state.selectMode = false;
  state.selectedIds = [];
  localStorage.setItem('bib_tab', 'scan');
  render();
  window.history.replaceState({ tab: 'scan' }, '', '#scan');
});

function escapeHtml(s){
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

let clampIdCounter = 0;
function clampedTextHtml(text, extraStyle){
  if (!text) return '';
  const id = `clamp-${++clampIdCounter}`;
  const long = text.length > 320;
  return `
    <div class="meta clamp-text${long ? ' clamped' : ''}" id="${id}" style="white-space:pre-wrap;${extraStyle||''}">${escapeHtml(text)}</div>
    ${long ? `<button type="button" class="link" id="${id}-btn" style="margin:2px 0 14px;" onclick="toggleClamp('${id}')">Pokaż więcej ▾</button>` : ''}
  `;
}

function toggleClamp(id){
  const el = document.getElementById(id);
  const btn = document.getElementById(id + '-btn');
  if (!el) return;
  const expanded = el.classList.toggle('clamped') === false;
  if (btn) btn.textContent = expanded ? 'Zwiń ▴' : 'Pokaż więcej ▾';
}

// ---------------- BOOT ----------------
async function boot(){
  if (!configured()){
    renderNotConfigured();
    return;
  }
  const shareToken = new URLSearchParams(location.search).get('share');
  if (shareToken){
    await bootPublicShare(shareToken);
    return;
  }
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
    global: { fetch: (url, options) => fetch(url, { ...options, cache: 'no-store' }) }
  });
  const { data } = await sb.auth.getSession();
  session = data.session;
  sb.auth.onAuthStateChange((_e, s)=>{ session = s; render(); if (session) ensureNavFoundation(); });
  if (session){
    await loadAll();
    maybeNotifyLoanAlerts();
    restoreDraft();
  }
  render();
  if (session) ensureNavFoundation();
}

async function bootPublicShare(token){
  const publicSb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  const { data, error } = await publicSb.rpc('get_shared_collection', { token });
  if (error || !data){
    app.innerHTML = `
      <div style="max-width:360px;margin:80px auto;padding:0 20px;text-align:center;">
        <img src="logo.svg" alt="Biblioteczka" style="width:64px;height:64px;border-radius:14px;margin-bottom:14px;">

        <p class="meta">Ten link do udostępnionej kolekcji jest nieprawidłowy albo wyłączony przez właściciela.</p>
      </div>`;
    return;
  }
  renderPublicShareView(data);
}

function publicBaseItems(){
  return publicShareItems.filter(i => i.status === (publicViewState.view === 'wishlist' ? 'wishlist' : 'owned'));
}

function renderPublicGrid(queryOnly){
  const base = publicBaseItems();
  const counts = {
    all: base.length,
    book: base.filter(i=>i.type==='book').length,
    movie: base.filter(i=>i.type==='movie').length,
    music: base.filter(i=>i.type==='music').length
  };
  if (!queryOnly){
    document.getElementById('public-type-tabs').innerHTML = ['all','book','movie','music'].map(t=>
      `<button class="${publicViewState.typeFilter===t?'active':''}" onclick="setPublicTypeFilter('${t}')">${t==='all'?'Wszystko':TYPE_LABELS[t]} (${counts[t]})</button>`
    ).join('');
    document.getElementById('public-sort').innerHTML = PUBLIC_SORT_OPTIONS.map(([v,label])=>
      `<option value="${v}" ${publicViewState.sortBy===v?'selected':''}>Sortuj: ${label}</option>`
    ).join('');
    const dirBtn = document.getElementById('public-sort-dir');
    const numeric = publicViewState.sortBy === 'year';
    dirBtn.textContent = publicViewState.sortDir==='desc' ? (numeric?'↓ malejąco':'Z-A ↓') : (numeric?'↑ rosnąco':'A-Z ↑');
  }
  const q = publicViewState.query.trim().toLowerCase();
  let filtered = publicViewState.typeFilter==='all' ? base : base.filter(i=>i.type===publicViewState.typeFilter);
  if (q) filtered = filtered.filter(i => (i.title||'').toLowerCase().includes(q) || (i.creator||'').toLowerCase().includes(q));
  const dir = publicViewState.sortDir === 'desc' ? -1 : 1;
  const collator = new Intl.Collator('pl', { sensitivity: 'base' });
  filtered = [...filtered].sort((a,b) => {
    if (publicViewState.sortBy === 'year') return dir * ((a.year||0) - (b.year||0));
    return dir * collator.compare((a[publicViewState.sortBy]||'').toString(), (b[publicViewState.sortBy]||'').toString());
  });
  document.getElementById('public-grid').innerHTML = filtered.length===0
    ? `<div class="empty" style="grid-column:1/-1;">Brak wyników.</div>`
    : filtered.map(i => publicGridItemHtml(i)).join('');
}

  const formatCounts = {};
  owned.forEach(i => { if (i.format) formatCounts[i.format] = (formatCounts[i.format]||0) + 1; });

  return `

const OVERDUE_DAYS = 30; // domyślny limit, gdy dla pożyczki nie ustawiono własnego terminu zwrotu

function loanDaysActive(loan){
  return Math.floor((Date.now() - new Date(loan.borrowed_at).getTime()) / 86400000);
}

function loanDueDate(loan){
  if (loan.due_date) return new Date(loan.due_date + 'T23:59:59');
  return new Date(new Date(loan.borrowed_at).getTime() + OVERDUE_DAYS * 86400000);
}

function loanDaysOverdue(loan){
  return Math.max(0, Math.ceil((Date.now() - loanDueDate(loan).getTime()) / 86400000));
}

function loanDaysLeft(loan){
  return Math.max(0, Math.ceil((loanDueDate(loan).getTime() - Date.now()) / 86400000));
}

function isOverdue(loan){
  return Date.now() > loanDueDate(loan).getTime();
}

const DUE_SOON_DAYS = 3;

function getLoanAlerts(){
  const overdue = state.loans.filter(isOverdue);
  const dueSoon = state.loans.filter(l => !isOverdue(l) && loanDaysLeft(l) <= DUE_SOON_DAYS);
  return { overdue, dueSoon };
}

function startScanner(onDecode){
  if (isDesktopDevice()) return null;
  onDecode = onDecode || onBarcode;
  if (state.scannerRunning || scannerStarting) return scannerStarting;
  html5Qr = new Html5Qrcode("reader");
  scannerStarting = html5Qr.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: { width: 250, height: 150 } },
    (decodedText)=>{ onDecode(decodedText); },
    ()=>{}
  ).then(()=>{ state.scannerRunning = true; }).catch(()=>{
    const readerEl = document.getElementById('reader');
    if (readerEl) readerEl.innerHTML = '<div class="empty">Brak dostępu do kamery. Sprawdź uprawnienia przeglądarki albo wpisz kod ręcznie.</div>';
  }).finally(()=>{ scannerStarting = null; });
  return scannerStarting;
}

async function stopScanner(){
  if (scannerStarting) await scannerStarting;
  if (html5Qr && state.scannerRunning){
    state.scannerRunning = false;
    try { await html5Qr.stop(); await html5Qr.clear(); } catch(e){}
  }
  html5Qr = null;
}

function manualBarcode(){
  const code = prompt('Wpisz kod kreskowy:');

function hwScanInputHtml(id, placeholder){
  placeholder = placeholder || 'Zeskanuj kod skanerem…';
  return `
    <div class="hw-scan-box">
      <div class="hw-scan-label">${icon('scan')} Skaner USB/Bluetooth — kliknij tutaj i zeskanuj (albo wpisz kod i Enter)</div>
      <input id="${id}" class="hw-scan-input" inputmode="none" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${placeholder}">
    </div>
  `;
}

// Skaner USB/BT (np. NETUM NT-1228BL) działa jako klawiatura — wpisuje kod i wysyła Enter.
// Na Androidzie ten "Enter" od zewnętrznej klawiatury Bluetooth często nie dociera jako
// zdarzenie keydown (zależnie od przeglądarki/IME), więc oprócz obsługi Entera dokładamy
// awaryjny mechanizm: skaner wpisuje cały kod błyskawicznie, więc krótka pauza w pisaniu
// (200ms bez nowego znaku) też oznacza, że skan się skończył — wysyłamy kod automatycznie.
function bindHwScanInput(id, onSubmit){
  const el = document.getElementById(id);
  if (!el) return;
  let timer = null;
  const submitNow = () => {
    clearTimeout(timer);
    const code = el.value.replace(/[\r\n]+$/, '').trim();
    el.value = '';
    if (code) onSubmit(code);
  };
  el.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' || e.key === 'Tab'){
      e.preventDefault();
      submitNow();
    }
  });
  el.addEventListener('input', () => {
    if (/[\r\n]/.test(el.value)){
      submitNow();
      return;
    }
    clearTimeout(timer);
    if (el.value.trim().length >= 4){
      timer = setTimeout(submitNow, 200);
    }
  });
  el.focus();
}

function skipBarcode(){
  setLookup({ barcode: null, type: 'book', title: '', creator: '', publisher: '', format: '', year: '', cover_url: '', status: state.addTarget });
  window.history.pushState({ form: 'new' }, '');
  render();
}

// Sprawdza sumę kontrolną kodu EAN-13/UPC-A/EAN-8 — jeśli się nie zgadza, kamera
// prawie na pewno błędnie odczytała jedną cyfrę (częste przy słabym świetle/pod kątem),
// więc nie ma sensu szukać takiego kodu w żadnej bazie.
function isValidBarcodeChecksum(code){
  if (!/^\d{8}$|^\d{12}$|^\d{13}$/.test(code)) return true; // nietypowa długość - nie oceniamy
  const digits = code.split('').map(Number);
  const check = digits.pop();
  let sum = 0;
  // dla EAN-13/UPC-A/EAN-8: licząc od najmniej znaczącej cyfry (zaraz przed check digit),
  // wagi na przemian 3,1,3,1...
  digits.reverse().forEach((d, i) => { sum += d * (i % 2 === 0 ? 3 : 1); });
  const expected = (10 - (sum % 10)) % 10;
  return expected === check;
}

let lookupLog = [];
function logStep(source, status){
  lookupLog.push({ source, status });
}

async function onBarcode(code){
  await stopScanner();
  const existing = state.items.find(i => i.barcode === code);
  if (state.scanActionMode === 'lend' || state.scanActionMode === 'return'){
    if (!existing){
      toast('Nie znaleziono tej pozycji w kolekcji — nie można jej wypożyczyć/zwrócić.');
      return;
    }
    const activeLoan = activeLoanFor(existing.id);
    if (state.scanActionMode === 'lend'){
      if (activeLoan){
        toast(`"${existing.title}" jest już wypożyczone`);
        openItem(existing.id);
      } else {
        setLendMode(existing.id, 'out');
      }
    } else {
      if (activeLoan){
        await returnLoan(activeLoan.id, existing.id); // pokazuje kartę pozycji z już zatwierdzonym zwrotem
      } else {
        toast(`"${existing.title}" nie jest obecnie wypożyczone`);
        openItem(existing.id);
      }
    }
    return;
  }
  if (existing){
    toast('Ta pozycja jest już w kolekcji');
    // Nie przełączamy state.tab na 'list' — user przyszedł tu ze skanowania, więc jeden Backspace
    // z karty pozycji ma wracać dokładnie tam (a nie na losowy, nieaktualny filtr Kolekcji).
    openItem(existing.id);
    if (state.checkMode){
      clearTimeout(checkModeTimer);
      const targetId = existing.id;
      checkModeTimer = setTimeout(() => {
        if (state.checkMode && state.openItemId === targetId) setTab('scan');
      }, 1500);
    }
    return;
  }
  lookupLog = [];
  if (!isValidBarcodeChecksum(code)){
    toast(`Kod ${code} ma niepoprawną sumę kontrolną — kamera prawdopodobnie źle odczytała cyfrę. Popraw go poniżej albo zeskanuj jeszcze raz.`);
  }
  let guess = { type: 'book', title: '', creator: '', publisher: '', format: '', year: '', cover_url: '' };
  if (isIsbn(code)){
    guess = await lookupBook(code) || guess;
  } else if (looksLikeBarcode(code)){
    guess = await lookupBarcodeGeneral(code) || guess;
  } else {
    // Nie jest to numeryczny kod kreskowy/ISBN (np. ktoś wpisał tu tytuł) — wysłanie tego jako
    // "barcode:" do MusicBrainz/Discogs potrafi trafić przypadkowym dopasowaniem tekstowym
    // i podmienić Rodzaj na Muzykę. Zamiast zgadywać, po prostu informujemy, że nic nie znaleziono.
    toast(`"${code}" nie wygląda na kod kreskowy ani ISBN — nic nie znaleziono. Uzupełnij dane ręcznie poniżej.`);
  }
  setLookup({ barcode: code, ...guess, status: state.addTarget, debugLog: lookupLog, checksumOk: isValidBarcodeChecksum(code) });
  window.history.pushState({ form: 'new' }, '');
  render();
}

function isIsbn(code){
  return /^97[89]\d{10}$/.test(code) || /^\d{9}[\dXx]$/.test(code);
}

// Kody EAN/UPC to wyłącznie cyfry (ew. ze spacjami/myślnikami przy ręcznym wpisywaniu) —
// odróżnia to prawdziwy kod od wpisanego przez pomyłkę tytułu/tekstu.
function looksLikeBarcode(code){
  return /^\d{6,14}$/.test(code.replace(/[\s-]/g, ''));
}

function stripTrailingPunct(s){
  return (s||'').replace(/[\s:;,/]+$/, '').trim();
}

function cleanPublisherName(s){
  return stripTrailingPunct((s||'').trim()).replace(/^["'„]+|["'”]+$/g, '').trim();
}

// Bibioteka Narodowa udostępnia pola MARC — pole 245 (tytuł), 100 (główny autor) i 260/264
// (wydawca, podpole b) są dużo dokładniejsze niż spłaszczone pola z odpowiedzi.
function parseBnMarc(bib){
  const fields = (bib.marc && bib.marc.fields) || [];
  let title = '';
  let publisher = '';
  const authors = [];
  for (const f of fields){
    if (f['245'] && !title){
      const sub = f['245'].subfields || [];
      const aPart = sub.find(s => s.a)?.a;
      if (aPart) title = stripTrailingPunct(aPart);
    }
    if (f['100']){
      const sub = f['100'].subfields || [];
      const aPart = sub.find(s => s.a)?.a;
      if (aPart) authors.push(stripTrailingPunct(aPart));
    }
    if ((f['260'] || f['264']) && !publisher){
      const sub = (f['260'] || f['264']).subfields || [];
      const bPart = sub.find(s => s.b)?.b;
      if (bPart) publisher = cleanPublisherName(bPart);
    }
  }
  return {
    title: title || cleanBnTitleFallback(bib.title),
    creator: authors.length ? authors.join('; ') : (bib.author || ''),
    publisher: publisher || cleanPublisherName(bib.publisher || '')
  };
}

function cleanBnTitleFallback(t){
  if (!t) return '';
  return stripTrailingPunct(t.split(' / ')[0]);
}

// Google Books ma zaskakująco dobre pokrycie okładek nawet dla polskich wydań, których
// nie ma Open Library — sprawdzamy to zawsze jako dodatkowe źródło okładki dla książek.
async function fetchGoogleBooksCover(isbn){
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/google-books?isbn=${encodeURIComponent(isbn)}`);
    const data = await res.json();
    const v = data.items && data.items[0] && data.items[0].volumeInfo;
    const url = v && v.imageLinks ? (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail || '') : '';
    return url.replace(/^http:/, 'https:');
  } catch(e){ return ''; }
}

async function lookupBook(code){
  // 1. Biblioteka Narodowa (najlepsze pokrycie polskich wydań)
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/bn-lookup?isbn=${encodeURIComponent(code)}`);
    const data = await res.json();
    const b = data.bibs && data.bibs[0];
    if (b){
      logStep('Biblioteka Narodowa', 'znaleziono');
      toast('Znaleziono dane książki (Biblioteka Narodowa)');
      const parsed = parseBnMarc(b);
      // BN nie udostępnia okładek — próbujemy Google Books, a jak nie ma, Open Library
      const gbCover = await fetchGoogleBooksCover(code);
      return {
        type: 'book',
        title: parsed.title,
        creator: parsed.creator,
        publisher: parsed.publisher,
        format: 'papierowa miękka',
        year: b.publicationYear ? (String(b.publicationYear).match(/\d{4}/)||[])[0]||'' : '',
        cover_url: gbCover || `https://covers.openlibrary.org/b/isbn/${encodeURIComponent(code)}-M.jpg?default=false`
      };
    }
    logStep('Biblioteka Narodowa', 'nie znaleziono');
  } catch(e){ logStep('Biblioteka Narodowa', 'błąd sieci'); }
  // 2. Open Library
  try {
    const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${encodeURIComponent(code)}&format=json&jscmd=data`);
    const data = await res.json();
    const b = data[`ISBN:${code}`];
    if (b){
      logStep('Open Library', 'znaleziono');
      toast('Znaleziono dane książki (Open Library)');
      const gbCover = await fetchGoogleBooksCover(code);
      return {
        type: 'book',
        title: b.title || '',
        creator: (b.authors||[]).map(a=>a.name).join(', '),
        publisher: (b.publishers||[]).map(p=>p.name).join(', '),
        format: 'papierowa miękka',
        year: b.publish_date ? (b.publish_date.match(/\d{4}/)||[])[0]||'' : '',
        cover_url: gbCover || `https://covers.openlibrary.org/b/isbn/${encodeURIComponent(code)}-M.jpg?default=false`
      };
    }
    logStep('Open Library', 'nie znaleziono');
  } catch(e){ logStep('Open Library', 'błąd sieci'); }
  // 3. Google Books (fallback, np. dla wydań spoza Open Library/BN)
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/google-books?isbn=${encodeURIComponent(code)}`);
    const data = await res.json();
    const v = data.items && data.items[0] && data.items[0].volumeInfo;
    if (v){
      logStep('Google Books', 'znaleziono');
      toast('Znaleziono dane książki (Google Books)');
      return {
        type: 'book',
        title: v.title || '',
        creator: (v.authors||[]).join(', '),
        publisher: v.publisher || '',
        format: 'papierowa miękka',
        year: v.publishedDate ? (v.publishedDate.match(/\d{4}/)||[])[0]||'' : '',
        cover_url: v.imageLinks ? (v.imageLinks.thumbnail || v.imageLinks.smallThumbnail || '').replace(/^http:/, 'https:') : ''
      };
    }
    logStep('Google Books', 'nie znaleziono');
  } catch(e){ logStep('Google Books', 'błąd sieci'); }
  return null;
}

function detectMovieFormat(text){
  if (/\b(blu[\s-]?ray|bd)\b/i.test(text) || /\b4k\s?u?hd\b/i.test(text)) return 'Blu-ray';
  if (/\bvhs\b/i.test(text)) return 'VHS';
  if (/\bdvd\b/i.test(text)) return 'DVD';
  return '';
}
function detectMusicFormat(text){
  if (/\b(vinyl|lp)\b/i.test(text)) return 'winyl';
  if (/\bcd\b/i.test(text)) return 'CD';
  if (/\b(cassette|kaseta|tape|mc)\b/i.test(text)) return 'kaseta';
  return '';
}

// UPCitemdb (darmowa baza) często zwraca tytuł żywcem z ogłoszenia na aukcji
// (eBay itp.) — usuwamy typowe śmieci sprzedażowe, kody i etykiety formatu,
// żeby w polu tytułu zostało samo "co to jest".
const LISTING_NOISE = [
  /free\s*shipping/gi, /fast\s*shipping/gi, /ships?\s*(fast|free|next\s*day|same\s*day)/gi,
  /us\s*seller/gi, /brand\s*new/gi, /new\s*sealed/gi, /factory\s*sealed/gi,
  /still\s*sealed/gi, /\bsealed\b/gi, /pre-?owned/gi, /like\s*new/gi,
  /very\s*good\s*condition/gi, /good\s*condition/gi, /excellent\s*condition/gi,
  /tested\s*(and\s*)?works?\s*(great|perfect|fine)?/gi, /\bworks?\s*(great|perfect|fine)\b/gi,
  /case\s*included/gi, /no\s*scratch(es)?/gi, /scratch\s*free/gi,
  /\bauthentic\b/gi, /\bgenuine\b/gi, /\brare\b/gi, /\bhtf\b/gi,
  /out\s*of\s*print/gi, /\boop\b/gi,
  /region\s*free/gi, /region\s*[0-9]\b/gi,
  /widescreen/gi, /fullscreen/gi, /full\s*screen/gi,
  /\bnew\b/gi, /\bused\b/gi, /\bmint\b/gi, /\bnib\b/gi, /\bnwt\b/gi,
  /combo\s*pack/gi, /\blot\s*of\s*\d+\b/gi, /\blot\b/gi,
  /\d+[\s-]?disc(s)?(\s*set)?\b/gi, /special\s*edition/gi, /collector'?s?\s*edition/gi,
  /anniversary\s*edition/gi,
  /\b4k\b/gi, /\buhd\b/gi, /\bblu[\s-]?rays?\b/gi, /\bdvds?\b/gi, /\bvhs\b/gi
];

// Etykietowane kody (UPC 012345678905, SKU: ABC-123, ASIN B00XYZ...) i gołe długie
// numery (kody kreskowe/SKU mają zwykle 6+ cyfr — realne tytuły rzadko mają tak długie liczby)
const CODE_LABEL_RE = /\b(upc|ean|isbn|asin|sku|mpn|model)\s*[:#]?\s*[a-z0-9-]{4,}\b/gi;
const BARE_CODE_RE = /\b\d{6,}\b/g;
const DECOR_CHARS_RE = /[★☆●○◆◇■□▲▼✦✧♦♥~_*]+/g;
// Ogłoszenia z UPCitemdb często doklejają obsadę, np. "Starring Denzel Washington, Russell Crowe"
// albo samą listę nazwisk na końcu tytułu — to nie jest część tytułu, więc wycinamy.
const CAST_KEYWORD_RE = /\b(starring|feat\.?|featuring|with)\s+.+$/i;
const TRAILING_NAME_LIST_RE = /(?:\s*[-–—:|,]\s*[A-Z][a-zà-ž'.]+(?:\s+[A-Z][a-zà-ž'.]+){1,3}){2,}[.,]*\s*$/;
// Katalogowy numer sprzedawcy na początku ("29063 - ...") i kody magazynowe typu
// "D0286" (litery zrośnięte z cyframi) — częste w feedach resellerów z UPCitemdb.
const LEADING_CATALOG_NUM_RE = /^\s*\d{3,7}\s*[-:–—]\s*/;
const SKU_CODE_RE = /\b[A-Za-z]{1,4}\d{3,}\b|\b\d{3,}[A-Za-z]{1,4}\b/g;

function cleanListingTitle(text){
  const original = (text || '').trim();
  let t = original;
  t = t.split(' | ')[0]; // wiele ogłoszeń ma format "Tytuł | Format | Free Shipping | ..."
  t = t.replace(LEADING_CATALOG_NUM_RE, ' ');
  t = t.replace(/[\[(][^\])]*[\])]/g, ' '); // usuń nawiasy z dopiskami
  t = t.replace(DECOR_CHARS_RE, ' ');
  t = t.replace(CODE_LABEL_RE, ' ');
  t = t.replace(SKU_CODE_RE, ' ');
  t = t.replace(BARE_CODE_RE, ' ');
  for (const re of LISTING_NOISE) t = t.replace(re, ' ');
  t = t.replace(/\b(19|20)\d{2}\b/g, ' '); // rok wyciągany jest osobno do pola "year" — w tytule tylko zaśmieca, i przeszkadza w rozpoznaniu końcówki z obsadą
  t = t.replace(CAST_KEYWORD_RE, ' ');
  t = t.replace(/,\s*,/g, ','); // puste pole między przecinkami ("Tytuł , , Aktor, Aktor, .") — częste w eksportach UPCitemdb
  t = t.replace(/\s*\.\s*$/, '');
  t = t.replace(TRAILING_NAME_LIST_RE, ' ');
  t = t.replace(/(?:\s*[-–—:|,])+\s*$/, '').replace(/^\s*(?:[-–—:|,]\s*)+/, '');
  t = t.replace(/\s{2,}/g, ' ').trim();
  return t || original; // jeśli wyczyściliśmy wszystko, zostaw oryginał do ręcznej poprawki
}

// MusicBrainz — darmowa, community'owa baza wydań muzycznych (dobre pokrycie międzynarodowe,
// dużo lepsze niż UPCitemdb dla płyt spoza USA). Obsługuje CORS bezpośrednio z przeglądarki.
// Okładka z Cover Art Archive (coverartarchive.org) — kwadratowa miniaturka po MBID wydania.
function detectMusicFormatFromMedia(media){
  const fmt = ((media && media.format) || '').toLowerCase();
  if (/vinyl|lp/.test(fmt)) return 'winyl';
  if (/cd/.test(fmt)) return 'CD';
  if (/cassette/.test(fmt)) return 'kaseta';
  return '';
}

function mbArtistNames(release){
  return ((release['artist-credit']) || [])
    .map(a => a.name || (a.artist && a.artist.name))
    .filter(Boolean)
    .join(', ');
}

async function lookupMusicBrainzByBarcode(code){
  try {
    const res = await fetch(`https://musicbrainz.org/ws/2/release/?query=barcode:${encodeURIComponent(code)}&fmt=json&limit=1`);
    const data = await res.json();
    const r = data.releases && data.releases[0];
    if (!r){ logStep('MusicBrainz', 'nie znaleziono'); return null; }
    logStep('MusicBrainz', 'znaleziono');
    toast('Znaleziono dane płyty (MusicBrainz)');
    return {
      type: 'music',
      title: r.title || '',
      creator: mbArtistNames(r),
      format: detectMusicFormatFromMedia(r.media && r.media[0]),
      year: r.date ? (r.date.match(/\d{4}/)||[])[0]||'' : '',
      cover_url: `https://coverartarchive.org/release/${r.id}/front-250`
    };
  } catch(e){ logStep('MusicBrainz', 'błąd sieci'); return null; }
}

// Discogs — kolekcjonerska baza wydań muzycznych, świetne pokrycie niszowych/regionalnych
// (np. polskich) płyt, których nie ma ani MusicBrainz, ani UPCitemdb. Obsługuje CORS.
async function lookupDiscogsByBarcode(code){
  try {
    const res = await fetch(`https://api.discogs.com/database/search?barcode=${encodeURIComponent(code)}&type=release`);
    const data = await res.json();
    const r = data.results && data.results[0];
    if (!r){ logStep('Discogs', 'nie znaleziono'); return null; }
    let detail = null;
    try { detail = await fetch(r.resource_url).then(x => x.json()); } catch(e){ /* zostaniemy przy skróconych danych */ }
    const title = (detail && detail.title) || (r.title||'').split(' - ').slice(1).join(' - ') || r.title || '';
    const creator = (detail && detail.artists && detail.artists.map(a=>a.name).join(', ')) || (r.title||'').split(' - ')[0] || '';
    const formatText = (detail && detail.formats && detail.formats[0] && detail.formats[0].name) || (r.format && r.format[0]) || '';
    const format = /vinyl/i.test(formatText) ? 'winyl' : /cd/i.test(formatText) ? 'CD' : /cassette/i.test(formatText) ? 'kaseta' : '';
    const year = String((detail && detail.year) || r.year || '').match(/\d{4}/)?.[0] || '';
    const img = (detail && detail.images && detail.images[0] && (detail.images[0].uri150 || detail.images[0].uri)) || '';
    logStep('Discogs', 'znaleziono');
    toast('Znaleziono dane płyty (Discogs)');
    return { type: 'music', title, creator, format, year, cover_url: img };
  } catch(e){ logStep('Discogs', 'błąd sieci'); return null; }
}

async function lookupBarcodeGeneral(code){
  // 1. MusicBrainz po kodzie kreskowym (najlepsze pokrycie dla płyt CD/winyl)
  const mb = await lookupMusicBrainzByBarcode(code);
  if (mb) return mb;
  // 2. Discogs — jeśli MusicBrainz nie znalazł (niszowe/regionalne wydania)
  const discogs = await lookupDiscogsByBarcode(code);
  if (discogs) return discogs;
  // 3. UPCitemdb - darmowe wyszukiwanie po kodzie EAN/UPC (limit ok. 100 zapytań/dzień, bez klucza)
  // Wołane przez nasz proxy (netlify/functions/upc-lookup.mjs), bo UPCitemdb blokuje CORS z przeglądarki.
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/upc-lookup?upc=${encodeURIComponent(code)}`);
    const data = await res.json();
    const item = data.items && data.items[0];
    if (item){
      const cat = (item.category || '').toLowerCase();
      const title = (item.title || '').toLowerCase();
      const isMusic = /music|vinyl|album|compact disc|soundtrack|\bcds?\b/.test(cat) || /vinyl|soundtrack|\balbum\b|\blp\b|\bcd\b/.test(title);
      const type = isMusic ? 'music' : 'movie';
      const format = type === 'movie' ? detectMovieFormat(item.title||'') : detectMusicFormat(item.title||'');
      const cleanTitle = cleanListingTitle(item.title||'');
      let guess = {
        type,
        title: cleanTitle || item.title || '',
        creator: item.brand || '',
        format,
        year: (item.title||'').match(/\b(19|20)\d{2}\b/)?.[0] || '',
        cover_url: (item.images && item.images[0]) || ''
      };
      logStep('UPCitemdb', 'znaleziono');
      toast('Znaleziono dane w bazie kodów kreskowych — sprawdź i popraw w razie potrzeby');
      if (type === 'movie'){
        const omdb = await lookupMovieDetails(cleanTitle);
        if (omdb) guess = { ...guess, ...omdb };
      }
      return guess;
    }
    logStep('UPCitemdb', 'nie znaleziono');
  } catch(e){ logStep('UPCitemdb', 'błąd sieci'); }
  toast('Nie znaleziono tego kodu w żadnej bazie — wyszukaj tytuł ręcznie poniżej');
  return { type: 'movie', title: '', creator: '', format: '', year: '', cover_url: '' };
}

async function tryOmdbTitle(title){
  try {
    const res = await fetch(`${FUNCTIONS_BASE}/omdb?t=${encodeURIComponent(title)}&type=movie`);
    const data = await res.json();
    if (data.Response === 'True'){
      logStep('OMDb', 'znaleziono ("' + title + '")');
      return {
        title: data.Title || title,
        creator: data.Director && data.Director !== 'N/A' ? data.Director : '',
        year: data.Year ? (data.Year.match(/\d{4}/)||[])[0]||'' : '',
        cover_url: data.Poster && data.Poster !== 'N/A' ? data.Poster : undefined
      };
    }
    logStep('OMDb', 'nie znaleziono po tytule "' + title + '"');
  } catch(e){ logStep('OMDb', 'błąd sieci'); }
  return null;
}

async function tryTmdbTitle(title){
  try {
    const results = await searchTmdbTitles(title);
    const r = results && results[0];
    if (r){
      const detail = await fetch(`${FUNCTIONS_BASE}/tmdb?i=${encodeURIComponent(r.id)}`).then(x => x.json()).catch(() => null);
      const director = detail && detail.credits && detail.credits.crew ? detail.credits.crew.find(c => c.job === 'Director') : null;
      logStep('TMDb', 'znaleziono ("' + title + '")');
      return {
        title: (detail && detail.title) || r.title || title,
        creator: director ? director.name : '',
        year: (detail && detail.release_date) ? detail.release_date.slice(0,4) : (r.release_date||'').slice(0,4),
        cover_url: (detail && detail.poster_path) ? `https://image.tmdb.org/t/p/w342${detail.poster_path}` : (r.poster_path ? `https://image.tmdb.org/t/p/w342${r.poster_path}` : undefined)
      };
    }
    logStep('TMDb', 'nie znaleziono po tytule "' + title + '"');
  } catch(e){ logStep('TMDb', 'błąd sieci'); }
  return null;
}

// Niektóre ogłoszenia z UPCitemdb doklejają na początku tytułu imię i nazwisko aktora
// (np. "Tom Cruise The Last Samurai") zamiast na końcu — regexy tego nie rozdzielą
// bez wiedzy, gdzie kończy się nazwisko, więc próbujemy dopasować tytuł też bez
// pierwszych 2-3 słów, jeśli wyglądają jak imię i nazwisko (same wielkie litery).
function buildTitleCandidates(title){
  const candidates = [title];
  const words = title.split(/\s+/).filter(Boolean);
  [2, 3].forEach(dropCount => {
    if (words.length > dropCount + 1){
      const leading = words.slice(0, dropCount);
      if (leading.every(w => /^[A-ZÀ-Ž][a-zà-ž'.-]+$/.test(w))){
        const stripped = words.slice(dropCount).join(' ');
        if (stripped && !candidates.includes(stripped)) candidates.push(stripped);
      }
    }
  });
  return candidates;
}

async function lookupMovieDetails(title){
  if (!title) return null;
  const candidates = buildTitleCandidates(title);
  for (const candidate of candidates){
    const omdb = await tryOmdbTitle(candidate);
    if (omdb){ toast('Znaleziono reżysera, rok premiery i plakat (OMDb)'); return omdb; }
  }
  // Zapasowo TMDb — czasem trafia tam, gdzie OMDb nie (i ma polskie tytuły)
  for (const candidate of candidates){
    const tmdb = await tryTmdbTitle(candidate);
    if (tmdb){ toast('Znaleziono dane filmu (TMDb)'); return tmdb; }
  }
  return null;
}

function findDuplicateItem(l){
  if (!l || l.editingId) return null;
  const barcode = (l.barcode || '').trim();
  const title = (l.title || '').trim().toLowerCase();
  const creator = (l.creator || '').trim().toLowerCase();
  return state.items.find(i =>
    (barcode && i.barcode === barcode) ||
    (title && i.title.trim().toLowerCase() === title && (i.creator||'').trim().toLowerCase() === creator)
  ) || null;
}

let bookSearchResults = [];

async function searchOpenLibraryBooks(title, author){
  if (!title && !author) return [];
  const params = new URLSearchParams();
  if (title) params.set('title', title);
  if (author) params.set('author', author);
  params.set('limit', '8');
  params.set('fields', 'key,title,author_name,first_publish_year,cover_i,isbn,publisher');
  try {
    const res = await fetch(`https://openlibrary.org/search.json?${params.toString()}`);
    const data = await res.json();
    return data.docs || [];
  } catch(e){ /* brak sieci */ }
  return [];
}

async function doBookSearch(){
  const title = document.getElementById('book-search-title').value.trim();
  const author = document.getElementById('book-search-author').value.trim();
  const box = document.getElementById('book-search-results');
  if (!title && !author) return;
  box.innerHTML = `<div class="meta">Szukam…</div>`;
  const results = await searchOpenLibraryBooks(title, author);

function selectOpenLibraryBook(i){
  const r = bookSearchResults[i];
  if (!r) return;
  state.lookup.title = r.title || state.lookup.title;
  state.lookup.creator = (r.author_name||[]).join(', ') || state.lookup.creator;
  state.lookup.year = r.first_publish_year ? String(r.first_publish_year) : state.lookup.year;

function coverPlaceholderHtml(type){
  const square = type === 'music';
  return `<div class="cover grid-placeholder${square ? ' square' : ''}" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);">${icon(type)}</div>`;
}

function coverImg(url, size, type){
  if (!url) return '';
  const square = type === 'music';
  const cls = square ? 'cover square' : 'cover';
  const style = size ? `width:${size}px;height:${square ? size : Math.round(size*1.36)}px;` : '';
  // onerror atrybut jest w cudzysłowach ("..."), więc cudzysłowy z fallbackHtml kodujemy jako
  // &quot; (przeglądarka zdekoduje je z powrotem na " zanim wykona JS) — a sam string JS
  // budujemy w apostrofach, żeby zdekodowane " nie przerywały mu przedwcześnie.
  const fallback = coverPlaceholderHtml(type).replace(/"/g, '&quot;');
  return `<img src="${escapeHtml(url)}" alt="" class="${cls}" style="${style}" onerror="this.outerHTML='${fallback}'">`;
}

async function uploadCoverFile(){
  const fileEl = document.getElementById('f-cover-file');
  const file = fileEl.files && fileEl.files[0];
  if (!file) return;
  const statusEl = document.getElementById('cover-upload-status');
  statusEl.textContent = 'Wgrywam…';
  const ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g, '') || 'jpg';
  const path = `${session.user.id}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${ext}`;
  const { error: uploadError } = await sb.storage.from('covers').upload(path, file, { upsert: false });
  if (uploadError){
    statusEl.textContent = '';
    toast('Błąd wgrywania: ' + uploadError.message);
    return;
  }
  const { data } = sb.storage.from('covers').getPublicUrl(path);

async function saveItem(){
  const l = state.lookup;
  const title = document.getElementById('f-title').value.trim();
  if (!title){ toast('Podaj tytuł'); return; }
  const barcodeEl = document.getElementById('f-barcode');
  const indexEl = document.getElementById('f-index');
  const publisherEl = document.getElementById('f-publisher');
  const notesEl = document.getElementById('f-notes');
  const personalNotesEl = document.getElementById('f-personal-notes');
  const payload = {
    barcode: (barcodeEl ? barcodeEl.value.trim() : l.barcode) || null,
    index_number: (indexEl ? indexEl.value.trim() : '') || null,
    publisher: (publisherEl ? publisherEl.value.trim() : '') || null,
    type: document.getElementById('f-type').value,
    title,
    creator: document.getElementById('f-creator').value.trim() || null,
    format: document.getElementById('f-format').value.trim() || null,
    year: parseInt(document.getElementById('f-year').value) || null,
    cover_url: l.cover_url || null,
    notes: (notesEl ? notesEl.value.trim() : '') || null,
    personal_notes: (personalNotesEl ? personalNotesEl.value.trim() : '') || null,
    rating: l.rating || null,
    status: document.getElementById('f-wishlist').checked ? 'wishlist' : 'owned',
    watched: document.getElementById('f-watched').checked
  };
  if (payload.watched) payload.queue_position = null;
  if (!l.editingId){
    const dup = state.items.find(i =>
      (payload.barcode && i.barcode === payload.barcode) ||
      (i.title.trim().toLowerCase() === title.toLowerCase() && (i.creator||'').trim().toLowerCase() === (payload.creator||'').trim().toLowerCase())
    );
    if (dup){
      toast(dup.status==='wishlist' ? `"${dup.title}" jest już na Twojej liście życzeń ⭐ — otwieram tę pozycję` : `"${dup.title}" już masz w kolekcji 📚 — otwieram tę pozycję`);
      setLookup(null);
      render();
      openItem(dup.id);
      return;
    }
  }
  const { data, error } = l.editingId
    ? await sb.from('items').update(payload).eq('id', l.editingId).select('id').single()
    : await sb.from('items').insert(payload).select('id').single();
  if (error){ toast('Błąd zapisu: ' + error.message); return; }
  await loadAll();
  if (payload.watched) await renumberQueue();
  const wasEditing = l.editingId;
  const savedId = l.editingId || (data && data.id);
  setLookup(null);
  toast(wasEditing ? 'Zapisano zmiany' : 'Dodano do kolekcji');
  render();
  if (!wasEditing && state.batchScanMode && state.tab === 'scan' && !isDesktopDevice()) beginScan();
  else if (savedId) openItem(savedId);
}

async function addToQueue(itemId){
  const maxPos = Math.max(0, ...state.items.filter(i=>i.queue_position!=null).map(i=>i.queue_position));
  const { error } = await sb.from('items').update({ queue_position: maxPos + 1 }).eq('id', itemId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  toast('Dodano do kolejki');
  openItem(itemId);
}

async function removeFromQueue(itemId){
  const { error } = await sb.from('items').update({ queue_position: null }).eq('id', itemId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  await renumberQueue();
  toast('Usunięto z kolejki');
  if (state.listView === 'queue') renderTab(); else openItem(itemId);
}

async function renumberQueue(){
  const queued = state.items
    .filter(i => i.queue_position != null)
    .sort((a,b) => a.queue_position - b.queue_position);
  await Promise.all(queued.map((item, idx) =>
    item.queue_position !== idx + 1 ? sb.from('items').update({ queue_position: idx + 1 }).eq('id', item.id) : null
  ).filter(Boolean));
}

async function moveQueueItem(itemId, direction){
  const queued = state.items
    .filter(i => i.queue_position != null)
    .sort((a,b) => a.queue_position - b.queue_position);
  const idx = queued.findIndex(i => i.id === itemId);
  const swapIdx = idx + direction;
  if (idx === -1 || swapIdx < 0 || swapIdx >= queued.length) return;
  const a = queued[idx], b = queued[swapIdx];
  const { error } = await sb.from('items').update({ queue_position: b.queue_position }).eq('id', a.id);
  if (error){ toast('Błąd: ' + error.message); return; }
  await sb.from('items').update({ queue_position: a.queue_position }).eq('id', b.id);
  await loadAll();
  renderTab();
}

const SORT_OPTIONS = [
  ['title', 'Tytuł / album'],
  ['creator', 'Artysta / autor / reżyser'],
  ['format', 'Format'],
  ['year', 'Rok'],
  ['created_at', 'Data dodania'],
  ['rating', 'Ocena']
];
const SORT_NUMERIC_KEYS = ['year', 'created_at', 'rating'];

function sortSelect(){
  const numeric = SORT_NUMERIC_KEYS.includes(state.sortBy);
  const label = state.sortDir === 'desc'
    ? (numeric ? '↓ malejąco' : 'Z-A ↓')
    : (numeric ? '↑ rosnąco' : 'A-Z ↑');
  return `<div class="row" style="margin-bottom:10px;">
    <select onchange="setSortBy(this.value)" style="margin-bottom:0;">
      ${SORT_OPTIONS.map(([v,label])=>`<option value="${v}" ${state.sortBy===v?'selected':''}>Sortuj: ${label}</option>`).join('')}
    </select>
    <button type="button" class="btn small secondary" style="flex:0 0 auto;" onclick="toggleSortDir()" title="${state.sortDir==='desc' ? 'Malejąco — kliknij, aby zmienić na rosnąco' : 'Rosnąco — kliknij, aby zmienić na malejąco'}">${label}</button>
  </div>`;
}

function setSortBy(v){
  state.sortBy = v;
  localStorage.setItem('bib_sort', v);
  renderTab();
}

function toggleSortDir(){
  state.sortDir = state.sortDir === 'desc' ? 'asc' : 'desc';
  localStorage.setItem('bib_sort_dir', state.sortDir);
  renderTab();
}

function sortByField(list, getItem){
  const key = state.sortBy || 'title';
  const dir = state.sortDir === 'desc' ? -1 : 1;
  const collator = new Intl.Collator('pl', { sensitivity: 'base' });
  return [...list].sort((a, b) => {
    const ia = getItem ? (getItem(a) || {}) : a;
    const ib = getItem ? (getItem(b) || {}) : b;
    if (key === 'year') return dir * ((ia.year || 0) - (ib.year || 0));
    if (key === 'created_at') return dir * (new Date(ia.created_at || 0) - new Date(ib.created_at || 0));
    return dir * collator.compare((ia[key] || '').toString(), (ib[key] || '').toString());
  });
}

// ---------------- FILTR PO POLU (klikalne pola na karcie pozycji) ----------------
function filterByAttrEl(el){
  filterByAttr(el.dataset.field, el.dataset.value);
}

function filterByAttr(field, value){
  state.openItemId = null;
  state.attrFilter = { field, value };
  window.history.pushState({ view: 'attrFilter' }, '');
  render();
}

function closeAttrFilter(){
  state.attrFilter = null;
  renderTab();
}

function attrFilterLabel(field, value){
  if (field === 'type') return TYPE_LABELS[value] || value;
  if (field === 'year') return String(value);
  if (field === 'creator') return value;
  if (field === 'format') return value;
  return String(value);
}

function attrFieldTitle(field){
  return field === 'type' ? 'Rodzaj' : field === 'year' ? 'Rok' : field === 'format' ? 'Format' : field === 'creator' ? 'Autor / reżyser / artysta' : field;
}

function renderAttrFilter(main){
  const { field, value } = state.attrFilter;
  const matches = sortByField(state.items.filter(i => {
    if (field === 'year') return Number(i.year) === Number(value);
    if (field === 'type') return i.type === value;
    return (i[field] || '').toString().trim().toLowerCase() === String(value).trim().toLowerCase();
  }));
  main.innerHTML = `
    <button class="link" onclick="closeAttrFilter()">&larr; Wstecz</button>
    <div class="section-title" style="margin-top:12px;">${attrFieldTitle(field)}: ${escapeHtml(attrFilterLabel(field, value))} (${matches.length})</div>
    <div class="card">
      ${matches.length===0 ? `<div class="empty">Brak innych pozycji.</div>` :
        matches.map(i => {
          const loan = activeLoanFor(i.id);
          return `<div class="item-row" onclick="openItem('${i.id}')">
            ${i.cover_url ? coverImg(i.cover_url, null, i.type) : `<div class="cover${i.type==='music'?' square':''}" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);">${icon(i.type)}</div>`}
            <div style="flex:1;min-width:0;">
              <div class="name">${escapeHtml(i.title)}</div>
              <div class="meta">${escapeHtml(i.creator||'—')}${i.format?' · '+escapeHtml(i.format):''}${i.year?' · '+i.year:''}${i.status==='wishlist'?' · Lista życzeń':''}</div>
              ${loan ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;"><span class="badge ${isOverdue(loan)?'danger':'warn'}">${loan.direction==='in'?'od':'u'}: ${escapeHtml(loan.borrower_name)}</span></div>` : ''}
            </div>
          </div>`;
        }).join('')}
    </div>
  `;
}

function toggleSearch(){
  state.searchMode = !state.searchMode;
  if (!state.searchMode) state.searchQuery = '';
  else window.history.pushState({ view: 'search' }, '');
  render();
}

function onSearchInput(){
  const el = document.getElementById('search-q');
  state.searchQuery = el.value;
  renderTab();
  const moved = document.getElementById('search-q');
  if (moved){ moved.focus(); moved.setSelectionRange(moved.value.length, moved.value.length); }
}

function clearSearchQuery(){
  state.searchQuery = '';
  renderTab();
  const el = document.getElementById('search-q');
  if (el) el.focus();
}

function renderSearch(main){
  const q = (state.searchQuery || '').trim().toLowerCase();
  const results = sortByField(q ? state.items.filter(i =>
    (i.title||'').toLowerCase().includes(q) ||
    (i.creator||'').toLowerCase().includes(q) ||
    (i.publisher||'').toLowerCase().includes(q) ||
    (i.barcode||'').toLowerCase().includes(q) ||
    (i.index_number||'').toLowerCase().includes(q)
  ) : []);
  main.innerHTML = `
    <div style="position:relative;margin-bottom:14px;">
      <input id="search-q" value="${escapeHtml(state.searchQuery||'')}" placeholder="Szukaj: tytuł, autor, wydawnictwo, kod…" oninput="onSearchInput()" onkeydown="if(event.key===' '){event.preventDefault();clearSearchQuery();}" style="margin-bottom:0;${state.searchQuery ? 'padding-right:44px;' : ''}">
      ${state.searchQuery ? `<button type="button" onclick="clearSearchQuery()" aria-label="Wyczyść pole" title="Wyczyść i przygotuj do kolejnego skanu" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:none;background:var(--surface);color:var(--text-dim);border-radius:8px;font-size:16px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;">✕</button>` : ''}
    </div>
    ${q ? sortSelect() : ''}
    <div class="card">
      ${!q ? `<div class="empty">Zacznij pisać, żeby przeszukać całą kolekcję.</div>` :
        results.length===0 ? `<div class="empty">Brak wyników dla "${escapeHtml(state.searchQuery)}"</div>` :
        results.map(i=>{
          const loan = activeLoanFor(i.id);
          return `<div class="item-row" onclick="openItem('${i.id}')">
            ${i.cover_url ? coverImg(i.cover_url, null, i.type) : `<div class="cover${i.type==='music'?' square':''}" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);">${icon(i.type)}</div>`}
            <div style="flex:1;min-width:0;">
              <div class="name">${escapeHtml(i.title)}</div>
              <div class="meta">${escapeHtml(i.creator||'—')}${i.format?' · '+escapeHtml(i.format):''}${i.year?' · '+i.year:''}${i.rating?' · '+starsHtml(i.rating):''}</div>
              ${loan ? `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;"><span class="badge ${isOverdue(loan)?'danger':'warn'}">${loan.direction==='in'?'od':'u'}: ${escapeHtml(loan.borrower_name)}</span><span class="badge accent">${isOverdue(loan)?loanDaysOverdue(loan)+'d po terminie':loanDaysLeft(loan)+'d do zwrotu'}</span></div>` : ''}
            </div>
          </div>`;
        }).join('')}
    </div>
  `;
  const input = document.getElementById('search-q');
  if (input) input.focus();
}

function toggleSelectMode(){
  state.selectMode = !state.selectMode;
  if (!state.selectMode) state.selectedIds = [];
  renderTab();
}

function cancelSelectMode(){
  state.selectMode = false;
  state.selectedIds = [];
  renderTab();
}

function selectAllVisible(){
  state.selectedIds = [...state.visibleIds];
  renderTab();
}

function deselectAll(){
  state.selectedIds = [];
  renderTab();
}

function toggleSelect(id){
  const idx = state.selectedIds.indexOf(id);
  if (idx === -1) state.selectedIds.push(id); else state.selectedIds.splice(idx, 1);
  renderTab();
}

async function bulkDeleteItems(){
  if (state.selectedIds.length === 0) return;
  if (!confirm(`Na pewno usunąć ${state.selectedIds.length} pozycji z kolekcji?`)) return;
  const { error } = await sb.from('items').delete().in('id', state.selectedIds);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  toast(`Usunięto ${state.selectedIds.length} pozycji`);
  state.selectMode = false;
  state.selectedIds = [];
  renderTab();
}

async function bulkSetWatched(watched){
  if (state.selectedIds.length === 0) return;
  const payload = watched ? { watched, queue_position: null } : { watched };
  const { error } = await sb.from('items').update(payload).in('id', state.selectedIds);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  if (watched) await renumberQueue();
  toast(watched ? `Oznaczono ${state.selectedIds.length} pozycji jako obejrzane` : `Cofnięto status obejrzane dla ${state.selectedIds.length} pozycji`);
  state.selectMode = false;
  state.selectedIds = [];
  renderTab();
}

function openItem(id){
  const item = state.items.find(i=>i.id===id);
  if (!item) return;
  if (state.openItemId !== id) state.lendMode = null;
  state.openItemId = id;
  window.history.pushState({ item: id }, '');
  const loan = activeLoanFor(id);
  const main = document.getElementById('main');
  // Na desktopie (myszka/trackpad) okładka jest dużo większa i stoi obok szczegółów
  // zamiast nad nimi — .item-detail-card zmienia się w dwie kolumny wyłącznie przez CSS
  // (@media pointer:fine), markup jest ten sam dla telefonu i komputera.
  const coverSize = isDesktopDevice() ? 260 : 100;
  main.innerHTML = `
    <button class="link" onclick="state.openItemId=null;renderTab()">&larr; ${state.tab==='list' ? 'Wróć do listy' : 'Wstecz'}</button>
    <div class="card item-detail-card" style="margin-top:12px;">
      ${item.cover_url ? `
        <div class="item-detail-cover">
          <div class="cover-tap" style="text-align:center;margin-bottom:2px;cursor:pointer;" onclick="showCoverLightbox('${item.id}')" title="Kliknij, żeby powiększyć">
            ${coverImg(item.cover_url, coverSize, item.type)}
          </div>
          <div style="text-align:center;color:var(--text-dim);font-size:11px;margin-bottom:14px;">kliknij okładkę, aby powiększyć &middot; <a href="#" onclick="event.stopPropagation();removeSavedCover('${item.id}');return false;" style="color:var(--text-dim);text-decoration:underline;">usuń okładkę</a></div>
        </div>
      ` : ''}
      <div class="item-detail-body">
      <div class="section-title"><span class="attr-link" data-field="type" data-value="${escapeHtml(item.type)}" onclick="filterByAttrEl(this)">${TYPE_LABELS[item.type]}</span>${item.status==='wishlist' ? ' · Lista życzeń' : item.watched ? ' · '+CONSUMED_LABELS[item.type] : ' · '+TO_CONSUME_LABELS[item.type]}</div>
      <h2 style="margin:0 0 4px;">${escapeHtml(item.title)}</h2>
      <div class="meta mono item-detail-meta-compact" style="color:var(--text-dim);margin-bottom:14px;">${item.creator ? `<span class="attr-link" data-field="creator" data-value="${escapeHtml(item.creator)}" onclick="filterByAttrEl(this)">${escapeHtml(item.creator)}</span>` : '—'}${item.format?` · <span class="attr-link" data-field="format" data-value="${escapeHtml(item.format)}" onclick="filterByAttrEl(this)">${escapeHtml(item.format)}</span>`:''}${item.year?` · <span class="attr-link" data-field="year" data-value="${item.year}" onclick="filterByAttrEl(this)">${item.year}</span>`:''}${item.publisher?' · '+escapeHtml(item.publisher):''}${item.barcode?' · '+escapeHtml(item.barcode):''}${item.index_number?' · Indeks: '+escapeHtml(item.index_number):''}</div>
      <dl class="record-fields">
        ${item.creator ? `<div class="record-row"><dt>Autor</dt><dd><span class="attr-link" data-field="creator" data-value="${escapeHtml(item.creator)}" onclick="filterByAttrEl(this)">${escapeHtml(item.creator)}</span></dd></div>` : ''}
        ${item.publisher ? `<div class="record-row"><dt>Wydawca</dt><dd>${escapeHtml(item.publisher)}</dd></div>` : ''}
        ${item.year ? `<div class="record-row"><dt>Rok wydania</dt><dd><span class="attr-link" data-field="year" data-value="${item.year}" onclick="filterByAttrEl(this)">${item.year}</span></dd></div>` : ''}
        ${item.format ? `<div class="record-row"><dt>Format</dt><dd><span class="attr-link" data-field="format" data-value="${escapeHtml(item.format)}" onclick="filterByAttrEl(this)">${escapeHtml(item.format)}</span></dd></div>` : ''}
        ${item.barcode ? `<div class="record-row"><dt>Kod kreskowy</dt><dd class="mono">${escapeHtml(item.barcode)}</dd></div>` : ''}
        ${item.index_number ? `<div class="record-row"><dt>Numer indeksu</dt><dd class="mono">${escapeHtml(item.index_number)}</dd></div>` : ''}
      </dl>
      ${item.rating ? `<div style="color:var(--warn);font-size:18px;margin-bottom:10px;">${starsHtml(item.rating)}</div>` : ''}
      ${item.notes ? clampedTextHtml(item.notes, 'margin-bottom:14px;') : ''}
      ${item.personal_notes ? `
        <div class="section-title" style="margin-top:4px;">Notatki</div>
        ${clampedTextHtml(item.personal_notes, 'margin-bottom:14px;')}
      ` : ''}
      ${item.status!=='wishlist' ? `
        <button class="btn ${item.watched ? 'secondary' : ''}" style="margin-bottom:10px;" onclick="toggleWatched('${item.id}')">${item.watched ? `Cofnij: ${TO_CONSUME_LABELS[item.type]}` : `Oznacz: ${CONSUMED_LABELS[item.type]}`}</button>
      ` : ''}
      ${item.status!=='wishlist' && !item.watched ? `
        <button class="btn secondary" style="margin-bottom:10px;" onclick="${item.queue_position!=null ? `removeFromQueue('${item.id}')` : `addToQueue('${item.id}')`}">${item.queue_position!=null ? `Usuń z kolejki (#${item.queue_position})` : 'Dodaj do kolejki „co dalej"'}</button>

      ${item.status==='wishlist' ? `
        <button class="btn" onclick="markAsOwned('${item.id}')">Oznacz jako kupione</button>

        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;">
          <span class="badge ${isOverdue(loan)?'danger':'warn'}">${loan.direction==='in' ? 'Pożyczone od: '+escapeHtml(loan.borrower_name) : 'Wypożyczone: '+escapeHtml(loan.borrower_name)}</span>
          <span class="badge accent">${isOverdue(loan)?loanDaysOverdue(loan)+'d po terminie':loanDaysLeft(loan)+'d do zwrotu'}</span>
