      ` : renderLendBox(item)}
      <button class="btn secondary" style="margin-top:8px;" onclick="editItem('${item.id}')">Edytuj</button>
      <button class="btn danger" style="margin-top:8px;" onclick="deleteItem('${item.id}')">Usuń z kolekcji</button>
      </div>
    </div>
  `;
}

function showCoverLightbox(itemId){
  const item = state.items.find(i=>i.id===itemId);
  if (!item || !item.cover_url) return;
  const overlay = document.createElement('div');
  overlay.id = 'cover-lightbox';
  overlay.style.cssText = 'position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,0.9);display:flex;align-items:center;justify-content:center;padding:20px;cursor:zoom-out;';
  overlay.onclick = closeCoverLightbox;
  const img = document.createElement('img');
  img.src = item.cover_url;
  img.alt = '';
  img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;';
  overlay.appendChild(img);
  document.body.appendChild(overlay);
  document.addEventListener('keydown', closeCoverLightboxOnEsc);
}

function closeCoverLightbox(){
  const overlay = document.getElementById('cover-lightbox');
  if (overlay) overlay.remove();
  document.removeEventListener('keydown', closeCoverLightboxOnEsc);
}

function closeCoverLightboxOnEsc(e){
  if (e.key === 'Escape') closeCoverLightbox();
}

async function markAsOwned(itemId){
  const { error } = await sb.from('items').update({ status: 'owned' }).eq('id', itemId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  toast('Przeniesiono do kolekcji 🎉');
  openItem(itemId);
}

async function toggleWatched(itemId){
  const item = state.items.find(i=>i.id===itemId);
  if (!item) return;
  const nowWatched = !item.watched;
  const payload = nowWatched ? { watched: true, queue_position: null } : { watched: false };
  const { error } = await sb.from('items').update(payload).eq('id', itemId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  if (nowWatched) await renumberQueue();
  toast(nowWatched ? `Oznaczono: ${CONSUMED_LABELS[item.type]}` : `Cofnięto: ${TO_CONSUME_LABELS[item.type]}`);
  state.openItemId = null;
  renderTab();
}

async function removeSavedCover(itemId){
  const { error } = await sb.from('items').update({ cover_url: null }).eq('id', itemId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  toast('Usunięto okładkę');
  openItem(itemId);
}

function toLocalDateInput(d){
  const dt = new Date(d);
  const tzOffsetMs = dt.getTimezoneOffset() * 60000;
  return new Date(dt.getTime() - tzOffsetMs).toISOString().slice(0,10);
}

function todayIso(){
  return toLocalDateInput(new Date());
}

function renderLendBox(item){
  const mode = state.lendMode;
  if (mode === 'out' || mode === 'in'){
    const isIn = mode === 'in';
    return `
      <div class="badge ok" style="margin-bottom:12px;">Dostępne</div>
      <input id="borrower-name" placeholder="${isIn ? 'Od kogo pożyczyłeś?' : 'Komu pożyczasz?'}">
      <label>Data pożyczenia</label>
      <input type="date" id="borrow-date" value="${todayIso()}" onchange="onBorrowDateChange()">
      <label>Termin zwrotu</label>
      <input type="date" id="due-date-input" value="${toLocalDateInput(new Date(Date.now() + OVERDUE_DAYS*86400000))}">
      <button class="btn" onclick="lendItem('${item.id}','${mode}')">${isIn ? 'Zapisz' : 'Pożycz'}</button>
      <button class="btn secondary" style="margin-top:8px;" onclick="cancelLendMode('${item.id}')">Anuluj</button>
    `;
  }
  return `
    <div class="badge ok" style="margin-bottom:12px;">Dostępne</div>
    <button class="btn" onclick="setLendMode('${item.id}','out')">Pożycz komuś</button>
    <button class="btn" style="margin-top:8px;background:var(--warn);color:#1a1a1a;" onclick="setLendMode('${item.id}','in')">Zarejestruj jako pożyczone od kogoś</button>
  `;
}

function onBorrowDateChange(){
  const borrowVal = document.getElementById('borrow-date').value;
  const dueEl = document.getElementById('due-date-input');
  if (!borrowVal || !dueEl) return;
  const borrowDate = new Date(borrowVal + 'T12:00:00');
  dueEl.value = toLocalDateInput(new Date(borrowDate.getTime() + OVERDUE_DAYS*86400000));
}

function setLendMode(itemId, mode){
  state.lendMode = mode;
  openItem(itemId);
}

function cancelLendMode(itemId){
  state.lendMode = null;
  openItem(itemId);
}

async function lendItem(itemId, direction){
  const name = document.getElementById('borrower-name').value.trim();
  if (!name){ toast(direction === 'in' ? 'Podaj od kogo pożyczyłeś' : 'Podaj komu pożyczasz'); return; }
  const dateVal = document.getElementById('borrow-date').value || todayIso();
  const borrowed_at = new Date(dateVal + 'T12:00:00').toISOString();
  const due_date = document.getElementById('due-date-input').value || null;
  const { error } = await sb.from('loans').insert({ item_id: itemId, borrower_name: name, borrowed_at, direction, due_date });
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  state.lendMode = null;
  toast(direction === 'in' ? 'Zarejestrowano jako pożyczone' : 'Zapisano wypożyczenie');
  openItem(itemId);
}

async function updateLoanDate(loanId, itemId){
  const dateVal = document.getElementById('loan-date-input').value;
  if (!dateVal) return;
  const borrowed_at = new Date(dateVal + 'T12:00:00').toISOString();
  const { error } = await sb.from('loans').update({ borrowed_at }).eq('id', loanId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  toast('Zaktualizowano datę pożyczenia');
  openItem(itemId);
}

async function updateDueDate(loanId, itemId){
  const dueVal = document.getElementById('due-date-edit-input').value || null;
  const { error } = await sb.from('loans').update({ due_date: dueVal }).eq('id', loanId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  toast(dueVal ? 'Zaktualizowano termin zwrotu' : 'Usunięto własny termin zwrotu (domyślny limit ' + OVERDUE_DAYS + ' dni)');
  openItem(itemId);
}

// stayOnItemId: gdy podane, po zwrocie zostajemy na karcie tej pozycji (odświeżonej,
// już bez aktywnego wypożyczenia) zamiast wracać do listy/zakładki, z której przyszliśmy.
async function returnLoan(loanId, stayOnItemId){
  const loan = state.loans.find(l => l.id === loanId);
  const { error } = await sb.from('loans').update({ returned_at: new Date().toISOString() }).eq('id', loanId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  state.loanHistory = null;
  toast(loan && loan.direction === 'in' ? 'Oznaczono jako oddane właścicielowi' : 'Oznaczono zwrot');
  if (stayOnItemId) openItem(stayOnItemId); else renderTab();
}

async function deleteItem(itemId){
  if (!confirm('Na pewno usunąć tę pozycję z kolekcji?')) return;
  const { error } = await sb.from('items').delete().eq('id', itemId);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  setLookup(null);
  toast('Usunięto');
  renderTab();
}

function editItem(id){
  const item = state.items.find(i => i.id === id);
  if (!item) return;
  const lookupValue = {
    editingId: item.id,
    barcode: item.barcode || null,
    type: item.type,
    title: item.title || '',
    creator: item.creator || '',
    format: item.format || '',
    year: item.year || '',
    cover_url: item.cover_url || '',
    index_number: item.index_number || '',
    publisher: item.publisher || '',
    notes: item.notes || '',
    personal_notes: item.personal_notes || '',
    rating: item.rating || null,
    status: item.status || 'owned',
    watched: item.watched || false,
    checksumOk: item.barcode ? isValidBarcodeChecksum(item.barcode) : true,
    debugLog: []
  };
  setLookup(lookupValue);
  window.history.pushState({ form: 'edit', id }, '');
  render();
}

      </div>
    ` : ''}
    <button class="btn small secondary" style="margin-bottom:12px;" onclick="toggleLoanHistory()">${state.showLoanHistory ? 'Ukryj historię' : 'Pokaż historię zwróconych'}</button>
  `;

  if (state.showLoanHistory){
    main.innerHTML = `${scanBtn}${toolbar}${renderLoanHistoryHtml()}`;
    bindHwScanInput('hw-scan-loan', onLoanBarcode);
    return;
  }

  if (state.loans.length===0){
    main.innerHTML = `${scanBtn}${toolbar}<div class="card"><div class="empty">Nic obecnie nie jest pożyczone.</div></div>`;
    bindHwScanInput('hw-scan-loan', onLoanBarcode);
    return;
  }

  const byType = state.loanTypeFilter==='all' ? state.loans : state.loans.filter(l=>{
    const item = state.items.find(i=>i.id===l.item_id);
    return item && item.type === state.loanTypeFilter;
  });
  let filtered = sortByField(byType, l => state.items.find(i=>i.id===l.item_id));
  if (state.loanQuickFilter === 'overdue') filtered = filtered.filter(isOverdue);
  const lentOut = filtered.filter(l => l.direction !== 'in' && state.loanQuickFilter !== 'in');
  const borrowedIn = filtered.filter(l => l.direction === 'in' && state.loanQuickFilter !== 'out');

  const loanRow = (l, returnLabel) => {
    const item = state.items.find(i=>i.id===l.item_id);
    const checked = state.selectedLoanIds.includes(l.id);
    return `<div class="item-row" onclick="${state.loanSelectMode ? `toggleSelectLoan('${l.id}')` : `openItem('${l.item_id}')`}">
      ${state.loanSelectMode ? `<input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleSelectLoan('${l.id}')" style="width:18px;height:18px;flex-shrink:0;margin:0;">` : ''}
      ${item && item.cover_url ? coverImg(item.cover_url, null, item.type) : `<div class="cover${item && item.type==='music'?' square':''}" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);">${icon(item ? item.type : 'book')}</div>`}
      <div style="flex:1;">
        <div class="name">${escapeHtml(item ? item.title : '—')}</div>
        <div class="meta" style="${isOverdue(l)?'color:var(--danger);':''}">${l.direction==='in'?'od':'u'}: ${escapeHtml(l.borrower_name)} · od ${new Date(l.borrowed_at).toLocaleDateString('pl-PL')}</div>
        <span class="badge accent" style="margin-top:4px;">${isOverdue(l)?loanDaysOverdue(l)+'d po terminie':loanDaysLeft(l)+'d do zwrotu'}</span>
      </div>
      ${state.loanSelectMode ? '' : `<button class="btn small secondary" style="flex:0 0 auto;" onclick="event.stopPropagation();returnLoan('${l.id}')">${returnLabel}</button>`}
    </div>`;
  };

  main.innerHTML = `
    ${scanBtn}
    ${toolbar}
    ${lentOut.length===0 && borrowedIn.length===0 ? `<div class="card"><div class="empty">Brak pożyczek w tej kategorii.</div></div>` : ''}
    ${lentOut.length ? `
      <div class="section-title">Wypożyczone innym (${lentOut.length})</div>
      <div class="card">${lentOut.map(l => loanRow(l, 'Zwrot')).join('')}</div>
    ` : ''}
    ${borrowedIn.length ? `
      <div class="section-title">Pożyczone od kogoś (${borrowedIn.length})</div>
      <div class="card">${borrowedIn.map(l => loanRow(l, 'Oddane')).join('')}</div>
    ` : ''}
  `;
  bindHwScanInput('hw-scan-loan', onLoanBarcode);
}

async function toggleLoanHistory(){
  state.showLoanHistory = !state.showLoanHistory;
  if (state.showLoanHistory && state.loanHistory === null){
    state.loanHistoryLoading = true;
    renderTab();
    const { data, error } = await sb.from('loans').select('*').not('returned_at', 'is', null).order('returned_at', { ascending: false }).limit(200);
    state.loanHistoryLoading = false;
    if (error){ toast('Błąd wczytywania historii: ' + error.message); state.loanHistory = []; }
    else state.loanHistory = data || [];
  }
  renderTab();
}

function renderLoanHistoryHtml(){
  if (state.loanHistoryLoading) return `<div class="card"><div class="empty">Wczytywanie…</div></div>`;
  const history = state.loanHistory || [];
  const byType = state.loanTypeFilter==='all' ? history : history.filter(l=>{
    const item = state.items.find(i=>i.id===l.item_id);
    return item && item.type === state.loanTypeFilter;
  });
  const historyToolbar = `
    <div class="row" style="margin-bottom:12px;">
      <button class="btn small secondary" onclick="toggleHistorySelectMode()">${state.historySelectMode ? 'Gotowe' : 'Zaznacz'}</button>
    </div>
    ${state.historySelectMode ? `
      <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;padding:12px;flex-wrap:wrap;">
        <span class="meta">Zaznaczono: ${state.selectedHistoryIds.length}</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn small secondary" onclick="selectAllHistory()">Zaznacz wszystko</button>
          <button class="btn small secondary" onclick="cancelHistorySelectMode()">Anuluj</button>
          <button class="btn small danger" onclick="deleteSelectedHistory()" ${state.selectedHistoryIds.length===0?'disabled':''}>Usuń zaznaczone</button>
        </div>
      </div>
    ` : ''}
  `;
  if (byType.length === 0) return `${historyToolbar}<div class="card"><div class="empty">Brak historii zwróconych pożyczek.</div></div>`;
  return `${historyToolbar}<div class="section-title">Historia zwróconych (${byType.length})</div>
    <div class="card">
      ${byType.map(l => {
        const item = state.items.find(i=>i.id===l.item_id);
        const checked = state.selectedHistoryIds.includes(l.id);
        return `<div class="item-row" onclick="${state.historySelectMode ? `toggleSelectHistory('${l.id}')` : `openItem('${l.item_id}')`}">
          ${state.historySelectMode ? `<input type="checkbox" ${checked?'checked':''} onclick="event.stopPropagation();toggleSelectHistory('${l.id}')" style="width:18px;height:18px;flex-shrink:0;margin:0;">` : ''}
          ${item && item.cover_url ? coverImg(item.cover_url, null, item.type) : `<div class="cover${item && item.type==='music'?' square':''}" style="display:flex;align-items:center;justify-content:center;color:var(--text-dim);">${icon(item ? item.type : 'book')}</div>`}
          <div style="flex:1;min-width:0;">
            <div class="name">${escapeHtml(item ? item.title : '—')}</div>
            <div class="meta">${l.direction==='in'?'od':'u'}: ${escapeHtml(l.borrower_name)} · ${new Date(l.borrowed_at).toLocaleDateString('pl-PL')} → ${new Date(l.returned_at).toLocaleDateString('pl-PL')}</div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
}

function toggleHistorySelectMode(){
  state.historySelectMode = !state.historySelectMode;
  if (!state.historySelectMode) state.selectedHistoryIds = [];
  renderTab();
}

function cancelHistorySelectMode(){
  state.historySelectMode = false;
  state.selectedHistoryIds = [];
  renderTab();
}

function toggleSelectHistory(id){
  const idx = state.selectedHistoryIds.indexOf(id);
  if (idx === -1) state.selectedHistoryIds.push(id); else state.selectedHistoryIds.splice(idx, 1);
  renderTab();
}

function selectAllHistory(){
  const history = state.loanHistory || [];
  const byType = state.loanTypeFilter==='all' ? history : history.filter(l=>{
    const item = state.items.find(i=>i.id===l.item_id);
    return item && item.type === state.loanTypeFilter;
  });
  state.selectedHistoryIds = byType.map(l=>l.id);
  renderTab();
}

async function deleteSelectedHistory(){
  if (state.selectedHistoryIds.length === 0) return;
  if (!confirm(`Na pewno usunąć ${state.selectedHistoryIds.length} pozycji z historii wypożyczeń? Tej operacji nie można cofnąć.`)) return;
  const { error } = await sb.from('loans').delete().in('id', state.selectedHistoryIds);
  if (error){ toast('Błąd: ' + error.message); return; }
  state.loanHistory = (state.loanHistory || []).filter(l => !state.selectedHistoryIds.includes(l.id));
  toast(`Usunięto ${state.selectedHistoryIds.length} pozycji z historii`);
  state.historySelectMode = false;
  state.selectedHistoryIds = [];
  renderTab();
}

function toggleLoanSelectMode(){
  state.loanSelectMode = !state.loanSelectMode;
  if (!state.loanSelectMode) state.selectedLoanIds = [];
  renderTab();
}

function cancelLoanSelectMode(){
  state.loanSelectMode = false;
  state.selectedLoanIds = [];
  renderTab();
}

function toggleSelectLoan(id){
  const idx = state.selectedLoanIds.indexOf(id);
  if (idx === -1) state.selectedLoanIds.push(id); else state.selectedLoanIds.splice(idx, 1);
  renderTab();
}

function setLoanTypeFilter(t){
  state.loanTypeFilter = t;
  renderTab();
}

function setLoanQuickFilter(v){
  state.loanQuickFilter = v;
  renderTab();
}

async function bulkReturnLoans(){
  if (state.selectedLoanIds.length === 0) return;
  if (!confirm(`Oznaczyć ${state.selectedLoanIds.length} pożyczek jako zakończone?`)) return;
  const { error } = await sb.from('loans').update({ returned_at: new Date().toISOString() }).in('id', state.selectedLoanIds);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  state.loanHistory = null;
  toast(`Zakończono ${state.selectedLoanIds.length} pożyczek`);
  state.loanSelectMode = false;
  state.selectedLoanIds = [];
  renderTab();
}

function startLoanScan(){
  if (isDesktopDevice()) return;
  state.loanScanning = true;
  renderTab();
}

async function cancelLoanScan(){
  await stopScanner();
  state.loanScanning = false;
  renderTab();
}

async function onLoanBarcode(code){
  await stopScanner();
  state.loanScanning = false;
  const item = state.items.find(i => i.barcode === code);
  if (!item){
    toast('Nie znaleziono takiej pozycji w kolekcji');
    if (state.loanBatchScanMode) startLoanScan(); else renderTab();
    return;
  }
  const loan = activeLoanFor(item.id);
  if (!loan){
    toast('Ta pozycja nie jest obecnie wypożyczona');
    openItem(item.id);
    return;
  }
  await returnLoan(loan.id);
  if (state.loanBatchScanMode) startLoanScan();
}

  const lentOutCount = state.loans.filter(l=>l.direction!=='in').length;

  const overdueCount = state.loans.filter(isOverdue).length;
  const toConsumeCount = owned.filter(i=>!i.watched).length;
  const rated = owned.filter(i=>i.rating);
  const avgRating = rated.length ? (rated.reduce((s,i)=>s+i.rating,0) / rated.length) : 0;
  const recent = [...owned].sort((a,b)=> new Date(b.created_at) - new Date(a.created_at)).slice(0,5);

  const formatCounts = {};
  owned.forEach(i => { if (i.format) formatCounts[i.format] = (formatCounts[i.format]||0) + 1; });

  const decadeCounts = {};
  owned.forEach(i => { if (i.year) { const d = Math.floor(i.year/10)*10; decadeCounts[d] = (decadeCounts[d]||0) + 1; } });
  const decadeRows = Object.entries(decadeCounts).sort((a,b)=>a[0]-b[0]);

  const addedYearCounts = {};

  const addedYearRows = Object.entries(addedYearCounts).sort((a,b)=>a[0]-b[0]);

  const topRated = [...owned].filter(i=>i.rating===5).sort((a,b)=> new Date(b.created_at) - new Date(a.created_at)).slice(0,10);

      <div class="meta" style="margin-bottom:14px;">${escapeHtml(session.user.email)}</div>

    </div>
    <div class="card">
      <div class="section-title">Statystyki</div>

      <div class="stat-grid">
        <div class="stat-tile" onclick="goToStat('all')"><div class="stat-num">${owned.length}</div><div class="stat-label">Razem</div></div>
        <div class="stat-tile" onclick="goToStat('book')"><div class="stat-num">${bookCount}</div><div class="stat-label">Książki</div></div>
        <div class="stat-tile" onclick="goToStat('movie')"><div class="stat-num">${movieCount}</div><div class="stat-label">Filmy</div></div>
        <div class="stat-tile" onclick="goToStat('music')"><div class="stat-num">${musicCount}</div><div class="stat-label">Muzyka</div></div>
      </div>
      ${(wishlistCount || toConsumeCount) ? `
        <div class="stat-group-label">Do zrobienia</div>
        <div class="stat-grid">
          ${wishlistCount ? `<div class="stat-tile" onclick="goToStat('wishlist')"><div class="stat-num" style="color:var(--warn);">${wishlistCount}</div><div class="stat-label">Lista życzeń</div></div>` : ''}
          ${toConsumeCount ? `<div class="stat-tile" onclick="goToStat('to_consume')"><div class="stat-num" style="color:var(--accent);">${toConsumeCount}</div><div class="stat-label">Do obejrzenia / przeczytania / odsłuchania</div></div>` : ''}
        </div>
      ` : ''}
      <div class="stat-group-label">Wypożyczenia</div>
      <div class="stat-grid">
        <div class="stat-tile" onclick="goToStat('all_loans')"><div class="stat-num">${state.loans.length}</div><div class="stat-label">Aktualnie</div></div>
        <div class="stat-tile" onclick="goToStat('out')"><div class="stat-num">${lentOutCount}</div><div class="stat-label">Wypożyczone innym</div></div>
        <div class="stat-tile" onclick="goToStat('in')"><div class="stat-num">${borrowedInCount}</div><div class="stat-label">Pożyczone od kogoś</div></div>
        <div class="stat-tile" onclick="goToStat('overdue')"><div class="stat-num" style="color:${overdueCount?'var(--danger)':'var(--ok)'};">${overdueCount}</div><div class="stat-label">Przeterminowane</div></div>
      </div>
      ${rated.length ? `
        <div class="stat-group-label">Oceny</div>
        <div class="stat-tile" style="text-align:left;display:flex;align-items:center;gap:12px;" onclick="goToStat('rating')">
          <div class="stat-num" style="color:var(--warn);">${avgRating.toFixed(1)}★</div>
          <div class="stat-label" style="margin-top:0;">średnia z ${rated.length} ${rated.length===1?'ocenionej pozycji':'ocenionych pozycji'}</div>
        </div>
      ` : ''}
    </div>
    ${formatRows.length ? `
      <div class="card">
        <div class="section-title">Wg formatu</div>
        ${formatRows.map(([label,count])=>barRow(label,count,maxFormat)).join('')}
      </div>
    ` : ''}
    ${decadeRows.length ? `
      <div class="card">
        <div class="section-title">Wg dekady</div>
        ${decadeRows.map(([decade,count])=>barRow(decade+'s',count,maxDecade)).join('')}
      </div>
    ` : ''}
    ${addedYearRows.length > 1 ? `
      <div class="card">
        <div class="section-title">Dodane w czasie</div>
        ${addedYearRows.map(([year,count])=>barRow(year,count,maxAddedYear)).join('')}

    ${recent.length ? `

        ${recent.map(i=>`<div class="item-row" onclick="openItem('${i.id}')">

          <div style="flex:1;min-width:0;">
            <div class="name">${escapeHtml(i.title)}</div>
            <div class="meta">${escapeHtml(i.creator||'—')}</div>

        <span class="meta">Pokazuj baner o przeterminowanych / zbliżających się terminach zwrotu w appce</span>

      <div class="section-title">Udostępnij kolekcję</div>
      <div class="meta" style="margin-bottom:10px;">Publiczny link tylko do odczytu (bez logowania) — pokazuje tytuły, okładki, oceny i opisy pozycji z Twojej kolekcji. Bez kodów kreskowych, notatek prywatnych ani wypożyczeń.</div>

function renderShareStatus(){
  if (state.appSettingsLoading || !state.appSettings) return `<div class="meta">Wczytywanie…</div>`;
  const s = state.appSettings;
  if (!s.share_enabled){
    return `<button class="btn secondary" onclick="toggleSharing(true)">Włącz udostępnianie</button>`;
  }
  const link = `${location.origin}${location.pathname}?share=${s.share_token}`;
  return `
    <input id="share-link" value="${escapeHtml(link)}" readonly onclick="this.select()" style="margin-bottom:10px;">
    <div class="row">
      <button class="btn small secondary" onclick="copyShareLink()">Kopiuj link</button>
      <button class="btn small secondary" onclick="regenerateShareLink()">Nowy link</button>
      <button class="btn small danger" onclick="toggleSharing(false)">Wyłącz</button>
    </div>
  `;
}

async function loadAppSettings(){
  state.appSettingsLoading = true;
  const { data, error } = await sb.from('app_settings').select('*').eq('id', 1).maybeSingle();
  state.appSettingsLoading = false;
  if (error){ toast('Błąd wczytywania ustawień udostępniania: ' + error.message); return; }
  state.appSettings = data || { id: 1, share_enabled: false, share_token: null };
  renderTab();
}

async function toggleSharing(on){
  const { data, error } = await sb.from('app_settings').update({ share_enabled: on }).eq('id', 1).select().maybeSingle();
  if (error){ toast('Błąd: ' + error.message); return; }
  state.appSettings = data;
  toast(on ? 'Udostępnianie włączone' : 'Udostępnianie wyłączone');
  renderTab();
}

async function regenerateShareLink(){
  if (!confirm('Stary link przestanie działać. Wygenerować nowy?')) return;
  const newToken = crypto.randomUUID();
  const { data, error } = await sb.from('app_settings').update({ share_token: newToken }).eq('id', 1).select().maybeSingle();
  if (error){ toast('Błąd: ' + error.message); return; }
  state.appSettings = data;
  toast('Wygenerowano nowy link');
  renderTab();
}

function copyShareLink(){
  const el = document.getElementById('share-link');
  if (!el) return;
  el.select();
  navigator.clipboard?.writeText(el.value).then(() => toast('Skopiowano link')).catch(() => toast('Zaznaczono link — skopiuj ręcznie (Ctrl/Cmd+C)'));
}

function renderBrokenCoversStatus(){
  if (state.brokenCoversChecking){
    return `<div class="meta">Sprawdzam ${state.brokenCoversProgress||0} / ${state.brokenCoversTotal||0}…</div>`;
  }
  if (state.brokenCoverIds){
    if (state.brokenCoverIds.length === 0){
      return `<div class="meta" style="color:var(--ok);">Wszystkie okładki działają ✓</div>`;
    }
    return `
      <div class="meta" style="color:var(--warn);margin-bottom:10px;">Znaleziono zepsutych okładek: ${state.brokenCoverIds.length}</div>
      <button class="btn danger" onclick="clearBrokenCovers()">Wyczyść zepsute okładki (${state.brokenCoverIds.length})</button>
      <button class="btn small secondary" style="margin-top:8px;" onclick="checkBrokenCovers()">Sprawdź ponownie</button>
    `;
  }
  return `<button class="btn secondary" onclick="checkBrokenCovers()">Sprawdź okładki</button>`;
}

async function checkBrokenCovers(){
  const items = state.items.filter(i => i.cover_url);
  state.brokenCoversChecking = true;
  state.brokenCoversProgress = 0;
  state.brokenCoversTotal = items.length;
  state.brokenCoverIds = null;
  renderTab();
  const broken = [];
  const CONCURRENCY = 8;
  let idx = 0;
  async function worker(){
    while (idx < items.length){
      const item = items[idx++];
      const ok = await testImageLoads(item.cover_url);
      if (!ok) broken.push(item.id);
      state.brokenCoversProgress++;
      if (state.brokenCoversProgress % 5 === 0 || state.brokenCoversProgress === items.length) renderTab();
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, items.length) }, worker));
  state.brokenCoversChecking = false;
  state.brokenCoverIds = broken;
  renderTab();
}

function testImageLoads(url){
  return new Promise(resolve => {
    const img = new Image();
    const timer = setTimeout(() => resolve(false), 10000);
    img.onload = () => { clearTimeout(timer); resolve(true); };
    img.onerror = () => { clearTimeout(timer); resolve(false); };
    img.src = url;
  });
}

async function clearBrokenCovers(){
  const ids = state.brokenCoverIds || [];
  if (ids.length === 0) return;
  if (!confirm(`Wyczyścić zapisany link do zdjęcia dla ${ids.length} pozycji? Będzie je można potem uzupełnić ponownie.`)) return;
  const { error } = await sb.from('items').update({ cover_url: null }).in('id', ids);
  if (error){ toast('Błąd: ' + error.message); return; }
  await loadAll();
  state.brokenCoverIds = null;
  toast(`Wyczyszczono ${ids.length} zepsutych okładek`);
  renderTab();
}

function notificationStatusHtml(){
  if (!('Notification' in window)) return `<div class="meta">Ta przeglądarka nie obsługuje powiadomień.</div>`;
  if (Notification.permission === 'granted') return `<div class="meta" style="color:var(--ok);">Powiadomienia włączone ✓</div>`;
  if (Notification.permission === 'denied') return `<div class="meta" style="color:var(--danger);">Powiadomienia zablokowane w przeglądarce — włącz je w ustawieniach witryny.</div>`;
  return `<button class="btn secondary" onclick="requestLoanNotifications()">Włącz powiadomienia</button>`;
}

async function requestLoanNotifications(){
  if (!('Notification' in window)){ toast('Ta przeglądarka nie obsługuje powiadomień'); return; }
  const perm = await Notification.requestPermission();
  renderTab();
  if (perm === 'granted') maybeNotifyLoanAlerts();
}

function maybeNotifyLoanAlerts(){
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const { overdue, dueSoon } = getLoanAlerts();
  if (!overdue.length && !dueSoon.length) return;
  const parts = [];
  if (overdue.length) parts.push(`Przeterminowane: ${overdue.length}`);
  if (dueSoon.length) parts.push(`Termin za ≤${DUE_SOON_DAYS} dni: ${dueSoon.length}`);
  new Notification('Biblioteczka — wypożyczenia', { body: parts.join(' · '), icon: 'icons/icon-192.png' });
}

function exportBackup(){
  const payload = {
    exported_at: new Date().toISOString(),
    items: state.items,
    loans: state.loans
  };
  const blob = new Blob([JSON.stringify(payload, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `biblioteczka-backup-${todayIso()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Pobrano kopię zapasową');
}

function csvEscape(v){
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}

function exportCsv(){
  const cols = ['title','type','creator','publisher','format','year','barcode','index_number','rating','status','watched','notes','personal_notes','created_at'];
  const header = ['Tytuł','Rodzaj','Autor/Reżyser/Artysta','Wydawnictwo','Format','Rok','Kod kreskowy','Indeks','Ocena','Status','Obejrzane','Opis','Notatki','Data dodania'];
  const cellValue = (item, col) => {
    if (col === 'type') return TYPE_LABELS[item.type] || item.type;
    if (col === 'watched') return item.watched ? 'tak' : 'nie';
    if (col === 'status') return item.status === 'wishlist' ? 'lista życzeń' : 'kolekcja';
    return item[col];
  };
  const lines = [header.join(',')];
  state.items.forEach(item => {
    lines.push(cols.map(c => csvEscape(cellValue(item, c))).join(','));
  });
  const blob = new Blob(['\uFEFF' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `biblioteczka-eksport-${todayIso()}.csv`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  toast('Pobrano eksport CSV');
}


document.addEventListener('DOMContentLoaded', boot);

// Cache'uje raz załadowane okładki (Service Worker), żeby nie pobierać ich ponownie przy każdej wizycie.
if ('serviceWorker' in navigator){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

// Gdy wracasz do karty/appki (np. z innego urządzenia dodano coś w międzyczasie) — odśwież dane.
// Pomijamy odświeżanie, gdy trwa edycja/dodawanie pozycji, żeby nie skasować niezapisanego formularza.
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible' && session && !state.lookup){
    await loadAll();
    if (state.tab === 'list' || state.tab === 'loans') renderTab();
  }
});
